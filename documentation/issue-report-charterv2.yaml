# ============================================================================
# StageManager — Issue Reporter Module Charter
# ============================================================================
# Version: 3.0.0
# Date: 2025-02-25
#
# This charter governs the build of the AI-driven issue reporter module
# for StageManager. The module uses the same wizard card interface as the
# idea intake but operates as a completely independent system. The AI
# guides the user through a conversational intake, classifies the
# submission as a bug or feature request, checks for duplicates against
# existing issues, and produces a structured report informed by the
# project's governing documents and charter execution plan.
#
# StageManager is a pure frontend application. All persistence is handled
# by BackStage (the backend system). This module uses mock data until
# BackStage integration is implemented.
# ============================================================================

charter:
  project: "StageManager Issue Reporter Module"
  repo: "stage-manager"
  charter_version: "3.0.0"
  charter_date: "2025-02-25"

  description: >
    An AI-driven issue reporting module for StageManager that guides users
    through a conversational intake process to produce structured bug reports
    and feature requests. The module shares the wizard card interface and
    visual language with the idea intake module but is completely independent
    in logic, AI behavior, data flow, and output. The AI determines whether
    the user is reporting a bug or requesting a feature based on the
    conversation — the user never has to classify it themselves.

    The AI has access to the project's governing documents (scaffolding),
    the charter execution plan, and existing issues. This allows it to ask
    informed questions, recognize potential duplicates, reference specific
    components and systems the user might be describing, and produce a
    report that is immediately actionable by a developer.

  owners:
    product_owner: "IT / Operations"
    tech_owner: "IT"

  # ==========================================================================
  # ARCHITECTURAL CONTEXT
  # ==========================================================================

  architecture:
    frontend: >
      StageManager is a pure frontend React SPA. It has no database and no
      server-side API of its own. All data persistence, retrieval, and
      server-side logic is handled by BackStage, a separate backend system
      that StageManager connects to via API.
    backend: >
      BackStage (not built yet). For this module, all data operations use
      mock data and Zustand stores with localStorage persistence. The data
      layer must be structured with clean interfaces so that swapping
      localStorage for BackStage API calls requires only changes to the
      store's data-fetching functions, not to any components.
    ai: >
      AI interactions route through OpenRouter (configured in the admin
      panel). The issue reporter uses the model assigned to the scoring/
      analysis function, or a dedicated model assignment if added to the
      admin AI configuration.

  # ==========================================================================
  # NON-NEGOTIABLES
  # ==========================================================================

  non_negotiables:
    - "The issue reporter is completely independent from the idea intake module. No shared state, no shared stores, no shared AI prompts, no shared data models."
    - "The issue reporter uses the same wizard card component (animated gradient border, bottom-border inputs, suggestion tags, action bar) but the component is shared UI only — not shared logic."
    - "The AI drives the conversation. There are no fixed steps. The wizard renders whatever the AI decides to ask next."
    - "The AI classifies the submission as 'bug' or 'feature' — the user never selects this themselves."
    - "The AI must have access to governing documents, existing issues, and the charter execution plan for the relevant project."
    - "StageManager has no database. All persistence uses mock data / localStorage for now. Data layer interfaces must be BackStage-ready."
    - "Do not modify the idea intake module in any way."
    - "Do not create shared stores or shared state between the issue reporter and the idea intake."

  # ==========================================================================
  # ENTRY POINT — Soft Pre-Filter
  # ==========================================================================

  entry_point:
    description: >
      A single "New" action is available throughout StageManager (dashboard
      quick actions, sidebar, etc.). When activated, it presents a soft
      pre-filter — two clear paths the user can choose between. This is
      not a classification step; it simply routes the user to the correct
      independent module.

    pre_filter:
      component: "PreFilterCard"
      description: >
        A single wizard card (same animated gradient border container)
        with a simple question and two large, clear selection options.
        No text input — just two clickable cards or buttons.
      question: "What would you like to do?"
      options:
        - id: idea
          label: "I have an idea"
          description: "Propose a new application or process improvement"
          icon: "Lightbulb"  # Lucide icon
          routes_to: "/new"  # Existing idea intake wizard
        - id: issue
          label: "I want to report an issue"
          description: "Report a bug or request a feature for an existing application"
          icon: "MessageCircleWarning"  # Lucide icon
          routes_to: "/report"  # Issue reporter wizard

      behavior: >
        Clicking an option immediately transitions to the respective
        module's wizard. The pre-filter card uses the same container
        and aesthetic as both wizards — the user experiences a seamless
        flow from selection into the conversation. If the user arrives
        from a context that implies their intent (e.g., clicking "Report
        Issue" on a production project's detail page), the pre-filter
        is skipped and the issue reporter launches directly with the
        project pre-selected.

    contextual_launch:
      description: >
        The issue reporter can also be launched directly with a
        pre-selected project context, bypassing the pre-filter. This
        happens when the user clicks "File Issue" from specific locations.
      launch_points:
        - location: "Production portal — actions"
          behavior: "Launches issue reporter with project pre-selected"
        - location: "Development portal — linked issues section"
          behavior: "Launches issue reporter with project pre-selected"
        - location: "Issues view — 'New Issue' button"
          behavior: "Launches issue reporter (no project pre-selected, AI will ask)"

  # ==========================================================================
  # THE AI-DRIVEN WIZARD
  # ==========================================================================

  wizard:
    route: /report
    component: "IssueReporterWizard"
    description: >
      A conversational intake powered by AI. Unlike the idea intake wizard
      which has fixed steps, the issue reporter wizard has no predetermined
      step sequence. The AI decides what to ask next based on the user's
      responses, the project context, and what it still needs to produce a
      complete report. The wizard card component is reused for its visual
      treatment only.

    # --- How the wizard works ------------------------------------------------

    flow:
      initialization:
        description: >
          When the wizard opens, it sends an initialization request to the
          AI with the available context (governing docs, existing issues,
          charter execution plan if a project is pre-selected). The AI
          responds with the first question. If no project is pre-selected,
          the first question will naturally establish which application or
          project the user is referring to.

      conversation_loop:
        description: >
          Each turn follows the same pattern:
          1. AI generates a question, optional suggestion tags, and
             optional helper text.
          2. The wizard card renders the question with the standard
             bottom-border input, suggestion tags, and action bar.
          3. The user responds (typing or clicking a suggestion tag).
          4. The response is appended to the conversation history.
          5. The full conversation history plus context is sent to the AI.
          6. The AI responds with either:
             a. Another question (loop continues), or
             b. A completion signal with the structured report.
          The wizard shows step dots that grow as the conversation
          progresses (dots are added dynamically, not pre-defined).

      completion:
        description: >
          When the AI has gathered enough information, it signals
          completion and returns a structured report. The wizard
          transitions to a review card showing the AI-generated report
          with the classification (bug or feature), a title, structured
          description, severity assessment, and any identified duplicates
          or related issues. The user can approve, edit, or restart.

    # --- AI behavior ---------------------------------------------------------

    ai:
      model_source: "OpenRouter — uses the model configured in admin settings"
      context_window:
        description: >
          Each AI request includes the full conversation history plus
          the relevant project context. The system prompt defines the
          AI's role and the context documents provide grounding.

        system_prompt_components:
          - role: >
              You are an issue intake specialist for a software development
              team. Your job is to guide the user through reporting a
              problem or requesting a feature. You ask clear, focused
              questions one at a time. You never ask the user to classify
              their submission — you determine whether this is a bug or
              a feature request based on what they tell you.
          - behavior: >
              Ask one question at a time. Keep questions conversational
              and specific. If the user's response is vague, ask a
              follow-up to clarify. If you recognize what they're
              describing based on the project context, reference specific
              components or systems by name to help them articulate the
              issue. If their description matches an existing issue,
              surface that potential duplicate and ask if it's the same
              problem.
          - classification_rules: >
              Classify as 'bug' if the user describes something that
              was working and stopped, something that doesn't match
              expected behavior, an error or crash, data loss or
              corruption, or a visual/UI defect. Classify as 'feature'
              if the user describes something that doesn't exist yet,
              a workflow improvement, a new capability, or an enhancement
              to existing functionality. If ambiguous, lean toward the
              classification that best serves the development team.
          - completion_rules: >
              You have enough information to complete when you understand:
              what the user is experiencing or requesting, which part of
              the application is involved, the expected vs actual behavior
              (for bugs) or the desired outcome (for features), how
              frequently it occurs or how many people it would affect,
              and any steps to reproduce (for bugs). Do not ask more
              questions than necessary. 3-6 questions is typical. Reach
              a conclusion efficiently.
          - severity_assessment: >
              Assess severity based on the conversation:
              Critical — system unusable, data loss, security issue.
              High — major feature broken, significant workflow impact.
              Medium — issue with workaround, moderate inconvenience.
              Low — cosmetic, minor annoyance, nice-to-have improvement.
          - output_format: >
              When you have enough information, respond with a JSON
              object containing: classification (bug or feature), title
              (concise summary), description (structured and actionable),
              severity (critical/high/medium/low), steps_to_reproduce
              (array, bugs only), expected_behavior (string, bugs only),
              actual_behavior (string, bugs only), desired_outcome
              (string, features only), affected_area (which part of the
              app), potential_duplicates (array of issue IDs that seem
              related, if any), and a done flag set to true.

        context_documents:
          scaffolding: >
            The project's scaffolding package. Gives the AI understanding
            of the organization's terminology, tech stack, quality
            standards, and how they describe their systems. Allows the
            AI to ask questions using the client's own language.
          charter_execution_plan: >
            The charter and execution plan for the relevant project.
            Gives the AI understanding of what was built, the component
            structure, the technical approach, and acceptance criteria.
            Allows the AI to reference specific parts of the application
            when asking follow-up questions.
          existing_issues: >
            Current open and recently resolved issues for the relevant
            project. Allows the AI to identify potential duplicates
            during the conversation and surface them to the user. Also
            helps the AI understand patterns — if there are several
            bugs in the same area, it might ask targeted questions
            about that component.

      suggestion_tags:
        description: >
          The AI generates contextual suggestion tags with each question.
          Unlike the idea intake where some tags are static, all issue
          reporter tags are AI-generated based on the conversation and
          project context. Tags help users who struggle to articulate
          technical problems by offering pre-formed descriptions they
          can click.
        examples:
          - question: "Which part of the application is this about?"
            tags: ["Dashboard", "Project list", "Data import", "Reporting", "User settings"]
            note: "Generated from the project's charter — these are actual components that exist."
          - question: "What happens when you encounter this problem?"
            tags: ["The page crashes", "Data doesn't save", "It's very slow", "The display is wrong", "I get an error message"]
          - question: "How often does this happen?"
            tags: ["Every time", "Most of the time", "Occasionally", "It happened once", "I'm not sure"]

    # --- AI response format --------------------------------------------------

    ai_response_schema:
      question_response:
        description: "AI wants to ask another question"
        fields:
          done: false
          question: "string — the next question to display"
          suggestions: "string[] — optional suggestion tags"
          helper_text: "string — optional helper text below the input"

      completion_response:
        description: "AI has enough information to produce the report"
        fields:
          done: true
          classification: "enum — 'bug' or 'feature'"
          title: "string — concise issue title"
          description: "string — structured, actionable description"
          severity: "enum — 'critical', 'high', 'medium', 'low'"
          steps_to_reproduce: "string[] — bugs only, null for features"
          expected_behavior: "string — bugs only, null for features"
          actual_behavior: "string — bugs only, null for features"
          desired_outcome: "string — features only, null for bugs"
          affected_area: "string — which component or section of the app"
          potential_duplicates: "object[] — { issueId, title, similarity_reason }"
          conversation_summary: "string — brief summary of the conversation for internal reference"

  # ==========================================================================
  # REVIEW CARD
  # ==========================================================================

  review_card:
    description: >
      After the AI completes its assessment, the wizard transitions to a
      review card. This uses the same animated gradient border container
      but renders a structured summary instead of a question. The user
      reviews the AI-generated report and can approve, edit fields, or
      restart the conversation.

    layout:
      header:
        description: >
          Classification badge (Bug or Feature Request) with severity
          badge. Both use the semantic color system. The AI-generated
          title is displayed prominently.
        elements:
          - classification_badge:
              bug: "Red badge with bug icon"
              feature: "Blue/teal badge with sparkle icon"
          - severity_badge:
              critical: "Red"
              high: "Amber/orange"
              medium: "Blue"
              low: "Muted/grey"
          - title:
              display: "text-xl sm:text-2xl font-light"
              editable: true  # Click to edit inline

      body:
        description: >
          The structured report rendered as clean, readable sections.
          Each section is editable — the user can refine before submitting.
        sections:
          - description:
              label: "Description"
              editable: true
              display: "Paragraph text"
          - steps_to_reproduce:
              label: "Steps to Reproduce"
              visible_when: "classification === 'bug'"
              editable: true
              display: "Numbered list"
          - expected_vs_actual:
              label: "Expected vs Actual Behavior"
              visible_when: "classification === 'bug'"
              editable: true
              display: "Two-column or labeled pair"
          - desired_outcome:
              label: "Desired Outcome"
              visible_when: "classification === 'feature'"
              editable: true
              display: "Paragraph text"
          - affected_area:
              label: "Affected Area"
              editable: true
              display: "Tag or short text"
          - severity:
              label: "Severity"
              editable: true
              display: "Dropdown — critical, high, medium, low"

      duplicates:
        description: >
          If the AI identified potential duplicates, they appear in a
          collapsible section. Each duplicate shows its title, status,
          and a brief explanation of why the AI thinks it might be
          related. The user can click to view the existing issue, confirm
          it's a duplicate (which links the new report to the existing
          one instead of creating a new issue), or dismiss and proceed
          with the new report.
        behavior:
          - "If duplicates found: section is expanded by default with a notice"
          - "User can click 'This is the same issue' → links to existing, no new issue created"
          - "User can click 'This is different' → proceeds with new issue"
          - "If no duplicates: section is hidden entirely"

      screenshot:
        description: >
          Screenshot attachment section. The user can capture a screenshot
          using the capture flow (html2canvas + region selection +
          annotation) or upload a file manually. This section appears
          on the review card, not during the conversation — the AI
          conversation focuses on understanding the problem first,
          visual evidence is added at the end.
        actions:
          - capture_screenshot:
              label: "Capture Screenshot"
              behavior: "Launches the CaptureOverlay flow (same as original bug reporter spec)"
          - upload_file:
              label: "Upload Image"
              behavior: "Standard file picker, accepts png/jpg/gif"
          - remove:
              label: "Remove"
              visible_when: "screenshot attached"
        display: >
          Thumbnail preview of the attached screenshot with a remove
          button. Click to expand full-size in a lightbox.

      actions:
        submit:
          label: "Submit Report"
          style: "gradient button (primary CTA)"
          behavior: >
            Creates the issue in the data store with all fields from the
            review card. Emits an activity event. Transitions to a
            confirmation view with a link to the new issue.
        restart:
          label: "Start Over"
          style: "muted text button"
          behavior: "Clears conversation history and returns to first question."
          confirmation: true
        cancel:
          label: "Cancel"
          style: "muted text button"
          behavior: "Returns to previous view without saving."
          confirmation: true  # Only if conversation has started

  # ==========================================================================
  # CAPTURE SYSTEM (Carried forward from original spec)
  # ==========================================================================

  capture_system:
    description: >
      Cross-platform screen capture using html2canvas for DOM snapshotting,
      Pointer Events for unified mouse/touch input, and Canvas API for
      region cropping and annotation rendering. Identical to the original
      bug reporter specification.

    flow:
      - step: "User clicks Capture Screenshot on the review card"
        action: "html2canvas captures full page DOM as offscreen canvas"
      - step: "Selection overlay appears"
        action: >
          Full-screen overlay with dimmed background. User draws a rectangle
          via pointerdown/pointermove/pointerup. Body scroll locked.
          Cancel via Esc or on-screen button.
      - step: "Region cropped"
        action: "Canvas drawImage extracts selected region at devicePixelRatio scale"
      - step: "Annotation canvas opens"
        action: >
          Cropped image with toolbar: freehand draw, arrows, rectangles,
          text. Color picker (7 colors) and stroke width (3 sizes).
          Undo support.
      - step: "User clicks Use Screenshot"
        action: "Annotated canvas exported as base64 PNG, attached to review card"

    ios_considerations:
      - "Body scroll locked (position: fixed + overflow: hidden) during overlay"
      - "safe-area-inset-* for positioning"
      - "touchAction: none on canvas elements"
      - "setPointerCapture for reliable tracking"
      - "Manual upload fallback always available"

  # ==========================================================================
  # DATA MODEL
  # ==========================================================================

  data_model:
    storage: "localStorage via Zustand (BackStage-ready interfaces)"

    issue:
      description: >
        The issue model for the reporter module. Stored independently
        from the idea model — no shared state. When BackStage is
        implemented, these map to the issues table.
      fields:
        - id: string                    # UUID
        - type: enum                    # bug, feature (AI-classified)
        - title: string                 # AI-generated, user-editable
        - description: string           # AI-generated structured description
        - severity: enum                # critical, high, medium, low (AI-assessed, user-editable)
        - status: enum                  # open, in_progress, resolved, closed, wont_fix
        - project_id: string | null     # Linked StageManager project/idea
        - app_id: string | null         # Source application identifier
        - source: enum                  # internal, external
        - environment: enum | null      # dsp, development, production
        - affected_area: string | null  # Component or section of the app
        - steps_to_reproduce: string[] | null  # Bugs only
        - expected_behavior: string | null     # Bugs only
        - actual_behavior: string | null       # Bugs only
        - desired_outcome: string | null       # Features only
        - reporter_name: string | null
        - reporter_email: string | null
        - reporter_user_id: string | null      # StageManager user ID if internal
        - screenshot: string | null            # Base64 PNG (localStorage) or path (BackStage)
        - metadata: object                     # Auto-captured: userAgent, URL, viewport, etc.
        - conversation_summary: string | null  # Brief summary of AI conversation
        - linked_duplicate_id: string | null   # If user confirmed duplicate
        - created_at: datetime
        - updated_at: datetime

    issue_comment:
      fields:
        - id: string
        - issue_id: string
        - author_name: string
        - author_user_id: string | null
        - body: string
        - created_at: datetime

  # ==========================================================================
  # FILE STRUCTURE
  # ==========================================================================

  structure:
    src/modules/issue-reporter/:
      components/:
        IssueReporterWizard.tsx: "Main wizard component — manages AI conversation loop and step rendering"
        ReviewCard.tsx: "AI-generated report review with editable fields, duplicate check, screenshot attachment"
        DuplicateCheck.tsx: "Collapsible section showing potential duplicate issues"
        ScreenshotSection.tsx: "Capture/upload controls and thumbnail preview on review card"
        CaptureOverlay.tsx: "Full-screen html2canvas capture with region selection"
        AnnotationCanvas.tsx: "Drawing tools on cropped screenshot"
        ConfirmationView.tsx: "Post-submission confirmation with link to new issue"

      lib/:
        ai-conversation.ts: "AI conversation manager — builds prompts, sends requests, parses responses"
        context-builder.ts: "Assembles AI context from scaffolding, charter, and existing issues"
        field-mapper.ts: "Maps AI completion response to issue data model"
        screenshot-utils.ts: "html2canvas wrapper, crop, export, base64 handling"
        mock-data.ts: "Sample issues, sample AI responses for demo mode"

      stores/:
        issue-reporter.ts: "Zustand store for conversation state, current report, screenshot"
        issues.ts: "Zustand store for submitted issues (BackStage-ready interface)"

      types/:
        index.ts: "TypeScript interfaces for AI responses, issue model, conversation state"

    note: >
      The issue reporter module lives entirely within src/modules/issue-reporter/
      and does not import from or share state with the idea intake module at
      src/components/wizard/. The shared wizard card UI component (animated
      border card, suggestion tags, action bar) lives in src/components/shared/
      and is imported by both modules independently.

  # ==========================================================================
  # SHARED UI COMPONENTS (used by both modules, owned by neither)
  # ==========================================================================

  shared_components:
    description: >
      These components provide the visual treatment shared between the idea
      intake and issue reporter wizards. They are purely presentational —
      no business logic, no state management, no AI interaction. They live
      in src/components/shared/ and are imported independently by each module.

    components:
      WizardCard:
        description: "The animated gradient border glassmorphism card container"
        props: ["children", "className"]

      WizardStepDots:
        description: "Step progress dots — receives count and current index"
        props: ["totalSteps", "currentStep"]

      WizardInput:
        description: "Bottom-border textarea with auto-grow"
        props: ["value", "onChange", "placeholder", "onSubmit"]

      WizardSuggestionTags:
        description: "Clickable suggestion tag row"
        props: ["suggestions", "onSelect", "selectedTag"]

      WizardActionBar:
        description: "OK button, Enter hint, optional Skip, voice mic placeholder"
        props: ["onSubmit", "onSkip", "submitLabel", "isSkippable", "isLastStep"]

      PreFilterCard:
        description: "The 'What would you like to do?' selection card"
        props: ["onSelectIdea", "onSelectIssue"]

  # ==========================================================================
  # PROTOTYPE SCOPE
  # ==========================================================================

  scope:
    included:
      - Pre-filter card with two paths (idea vs issue)
      - AI-driven conversational wizard with dynamic steps
      - AI classification of submissions as bug or feature
      - AI severity assessment
      - Contextual suggestion tags generated by AI per question
      - Potential duplicate detection surfaced during review
      - Review card with editable AI-generated report
      - Screenshot capture (html2canvas + region selection + annotation)
      - Manual file upload fallback
      - Auto-captured metadata (userAgent, URL, viewport, devicePixelRatio)
      - Confirmation view after submission
      - Contextual launch from production portal and issues view
      - Mock AI responses for demo without API key
      - Mock existing issues for duplicate detection demo
      - localStorage persistence via Zustand (BackStage-ready)
      - Shared wizard UI components extracted for reuse

    excluded:
      - BackStage API integration (mock data only)
      - Embeddable client bundle (deferred — requires BackStage for API)
      - Cross-app screenshot capture via embeddable reporter
      - Real-time collaboration on issues
      - File attachments beyond screenshots
      - Email notifications on new issues
      - Issue assignment to specific users
      - App registry management (deferred to BackStage)

    sample_data:
      existing_issues:
        - "5-8 sample issues across bug and feature types, mixed severities and statuses"
        - "At least 2 issues in the same affected area to demonstrate duplicate detection"
        - "Issues linked to at least one sample project in production state"
      mock_ai_responses:
        - "A complete bug conversation (4 questions → classified bug report)"
        - "A complete feature conversation (3 questions → classified feature request)"
        - "A conversation where a potential duplicate is identified"
      note: >
        Mock AI mode should simulate realistic response timing (500-1500ms
        delay) and return pre-recorded conversations that demonstrate the
        full flow. Toggle via VITE_USE_MOCK_DATA environment variable.

  # ==========================================================================
  # DO NOT
  # ==========================================================================

  do_not:
    - "Do not share state, stores, or AI prompts with the idea intake module."
    - "Do not modify the idea intake module in any way."
    - "Do not create a database or backend API — StageManager is frontend only."
    - "Do not use fixed wizard steps — the AI controls the conversation flow."
    - "Do not ask the user to classify their submission as bug or feature."
    - "Do not use getDisplayMedia for screenshots — not supported on iOS Safari."
    - "Do not store screenshots in any persistent backend — base64 in localStorage for prototype."
    - "Do not import from src/components/wizard/ — use shared components from src/components/shared/."
