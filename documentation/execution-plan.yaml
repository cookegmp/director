execution_plan:
  meta:
    project: "Director"
    repo: "director"
    plan_version: "1.0.0"
    generated_from_charter_date: "2026-03-21"
    owners:
      product_owner: "James — technical architect, methodology designer, lead consultant"
      tech_owner: "James"
    non_negotiables:
      - "Clone-and-strip must be clean: zero dead imports, zero orphaned files, zero references to removed modules after P0."
      - "Vite SPA on port 3950. No SSR. No server. No database. No API. No authentication layer."
      - "React 19.x + TypeScript 5.9.x strict mode. No implicit any. No ts-ignore without documented justification."
      - "Zustand 5.x with persist middleware. All stores use 'director-' key prefix in localStorage."
      - "DATA_VERSION constant in App.tsx drives full clear-and-reseed when incremented."
      - "VITE_USE_MOCK_DATA=true is the default. Every AI-powered feature must have a mock fallback with simulated delay. App must be fully demonstrable without any API keys."
      - "The design system (index.css tokens, shadcn/ui components, glassmorphism patterns, layout) is not modified during the strip — only the amber/gold --primary override and Director branding are changed."
      - "Every phase must close with: lint passes, typecheck passes, 'npm run build' succeeds, app renders with sample data on port 3950."
      - "Allowed hosts: localhost, 127.0.0.1, lab.ahaus.com, director.ahaus.com."
      - "No references to removed Control modules (issue-reporter, issue-scoring, agents-skills, dev-portal, admin, production, scoring, timeline, idea-views) may remain in any file."
    definition_of_done:
      - "Director repository exists as an independent project cloned from Control with all client-specific code removed and build verified clean."
      - "'npm install && npm run dev' starts Director on port 3950 with no errors or warnings."
      - "'npm run build' produces dist/ with zero TypeScript errors and zero lint warnings."
      - "Director's dark glassmorphism aesthetic matches Control exactly; amber/gold accent (hsl(38, 92%, 50%)) is the only visual differentiation."
      - "Clients page: filterable by status, sortable by name/date/status, client detail panel, new client form, status progression visualization."
      - "Engagements page: engagement list per client, phase progression controls, engagement detail tabs linking to discovery/scaffolding/OCAI."
      - "Discovery page: session list grouped by type, session creation form, AI-guided interview wizard using WizardCard pattern, transcript view with extracted data highlights, scaffolding section linkage indicators."
      - "Scaffolding page: two-tier layout (Operational Intelligence / Build Intelligence), section editors with completion indicators (empty/draft/reviewed/validated), terminology decoder management, export function, validation check."
      - "OCAI page: assessment dashboard, Level 1 builder with 10-12 behavioral scenario questions, Level 2 workflow-specific builder auto-generated from scaffolding, response collection interface, CVF radar chart, gap analysis view."
      - "Terminology page: searchable/sortable decoder table, add/edit/delete entries, bulk import from discovery sessions, JSON/CSV export."
      - "Settings page: OpenRouter API key entry stored in localStorage, model-selection per function, mock data toggle indicator, About section."
      - "Sample data auto-seeds on first load: Precision Dynamics (scaffolding phase, complete scaffolding package, 3 completed discovery sessions, L1 OCAI analyzed, L2 in progress, 30+ terminology entries) and Midwest Distribution Co (discovery phase, 2 sessions, partial scaffolding, L1 OCAI deployed)."
      - "No dead imports, no orphaned store keys, no references to removed Control modules anywhere in the codebase."

  global_conventions:
    progress_protocol:
      directory: ".agent-progress/"
      file_naming: "<PHASE>__<agent>.md"
      required_sections:
        - "## Scope"
        - "## Work Completed"
        - "## Touched Files"
        - "## Commands Run"
        - "## Notes / Risks"
        - "## Next Suggested Steps"
      instructions: >
        Each agent creates its progress file at the start of its workstream and
        updates it continuously. Progress files are committed with each phase
        closeout. They are the audit trail for what changed and why.

    dev_toggles:
      mock_data:
        env_var: "VITE_USE_MOCK_DATA"
        default: "true"
        behavior_when_true: "All OpenRouter calls are intercepted by mock handlers that return canned responses with a 600–1200ms simulated delay. No real API key is required."
        behavior_when_false: "OpenRouter API key from Settings store is used for live calls."
        visual_indicator: "Settings page shows a yellow 'MOCK MODE' badge when VITE_USE_MOCK_DATA=true."
        guard: "If VITE_USE_MOCK_DATA is false but no API key is set in the settings store, AI features display a 'Configure API key in Settings' prompt and do not call OpenRouter."

    env_management:
      required_files:
        - ".env (gitignored — local developer copy)"
        - ".env.example (committed — documents all variables with safe defaults)"
      variables:
        VITE_USE_MOCK_DATA:
          default: "true"
          description: "When true, all AI features use mock fallbacks."
      gitignore_additions:
        - ".env"
        - "dist/"
        - "node_modules/"
      notes: "Director has no server-side secrets. The only sensitive value is the OpenRouter API key, which is entered at runtime via the Settings page and stored in localStorage — it never appears in any env file."

    architecture_boundaries:
      framework: "Vite 7.x SPA. React 19.x with React Router DOM 7.x for client-side routing. No SSR, no server actions, no API routes."
      state: "Zustand 5.x with persist middleware only. No Redux, no Context for app state. React Context permitted only for UI-scoped concerns (e.g., theme)."
      storage: "localStorage exclusively via Zustand persist. No IndexedDB, no sessionStorage, no cookies."
      routing: "React Router DOM 7.x. All routes declared in App.tsx. Route paths: /clients, /engagements, /discovery, /scaffolding, /ocai, /terminology, /settings."
      styling: "Tailwind CSS 4.x with shadcn/ui Radix primitives. All tokens via CSS custom properties in index.css. No inline style objects for theming. Glassmorphism via bg-card/50 + backdrop-blur-sm."
      ai_integration: "OpenRouter called from a dedicated src/lib/openrouter.ts module. Mock mode intercepted in that module using IMPORT.META.ENV.VITE_USE_MOCK_DATA. API key read from the settings Zustand store — never from env files."
      component_library: "shadcn/ui components from src/components/ui/*. Do not reinstall or regenerate them during feature phases — they are inherited from Control."
      drag_and_drop: "dnd-kit only. No other DnD libraries."
      no_server: "Director has no Express server, no Fastify server, no Next.js server. If a feature requires server infrastructure, it is out of scope for this charter."

  phases:
    # ─────────────────────────────────────────────
    # P0 — Clone, Strip, and Verify Clean Shell
    # ─────────────────────────────────────────────
    - id: "P0"
      name: "Clone Control, Strip Client-Specific Code, Verify Clean Shell"
      goal: "Produce a Director repository that builds and renders cleanly with all Control client-specific code removed and Director identity applied."
      parallel_workstreams:
        - agent: "strip-agent"
          depends_on: []
          tasks:
            - "Clone the Control repository into a new directory named 'director'."
            - "Remove src/pages/DashboardPage.tsx, IntakePage.tsx, IssueReportPage.tsx, IdeasListPage.tsx, IdeaDetailPage.tsx, ChartersListPage.tsx, CharterViewPage.tsx, IssuesPage.tsx, ScaffoldingPage.tsx, NewPage.tsx."
            - "Remove src/modules/issue-reporter/*, src/modules/issue-scoring/*, src/modules/agents-skills/* (entire directories)."
            - "Remove src/components/dev-portal/*, src/components/admin/*, src/components/production/*, src/components/scoring/*, src/components/timeline/*, src/components/idea-views/*."
            - "Remove src/stores/ideas.ts, charters.ts, issues.ts, activity.ts, agent-sessions.ts, agents-skills.ts, scaffolding.ts, settings.ts, users.ts, dev-settings.ts."
            - "Remove src/lib/scoring.ts, charter-generator.ts, agent-connection.ts, abstraction-layer.ts, permissions.ts, sample-data.ts."
            - "Remove src/hooks/useIdeaTimeline.ts, useAgentConnection.ts."
            - "Remove src/types/index.ts."
            - "Remove mock-server/ directory entirely."
            - "Remove documentation/ directory if present."
            - "Remove public/level-set-logo.svg."
          progress_file: ".agent-progress/P0__strip-agent.md"

        - agent: "identity-agent"
          depends_on: ["strip-agent"]
          tasks:
            - "Update vite.config.ts: set server.port to 3950, set server.host to true, add allowedHosts: ['lab.ahaus.com', 'director.ahaus.com', 'localhost', '127.0.0.1']."
            - "Update package.json: set name to 'director', remove 'mock-server' npm scripts (e.g. 'mock', 'mock:server'), remove 'ws' from dependencies if present."
            - "Create .env with VITE_USE_MOCK_DATA=true."
            - "Create .env.example documenting VITE_USE_MOCK_DATA=true with description comment."
            - "In src/index.css, add CSS custom property override: --primary: hsl(38, 92%, 50%) — amber/gold Director accent. Document the override with a comment: /* Director accent — overrides Control blue. Single token change; all other tokens inherited from Control. */"
            - "Add a placeholder Director branding SVG at public/director-logo.svg (simple text-based SVG 'Director' in amber if no asset is available yet)."
            - "Update AppShell.tsx: replace Level Set AI logo reference with public/director-logo.svg, update any app name strings from Control/Level Set to 'Director'."
            - "Update Sidebar.tsx: replace Control nav items with Director nav items — Clients (/clients), Engagements (/engagements), Discovery (/discovery), Scaffolding (/scaffolding), OCAI (/ocai), Terminology (/terminology), Settings (/settings). Preserve all layout and animation classes."
            - "Update App.tsx: remove all Control routes and their imports, remove Control DATA_VERSION and seeding calls, add skeleton routes for all 7 Director pages rendering placeholder <div> components, set DATA_VERSION = 1."
            - "Add placeholder page components in src/pages/: ClientsPage.tsx, EngagementsPage.tsx, DiscoveryPage.tsx, ScaffoldingPage.tsx, OcaiPage.tsx, TerminologyPage.tsx, SettingsPage.tsx — each renders a titled placeholder div."
            - "Run 'npx tsc --noEmit' and fix every TypeScript error introduced by the removals (missing imports, broken references)."
            - "Run 'npm run lint' and fix every lint error and warning."
            - "Run 'npm run build' and confirm dist/ is produced with zero errors."
          progress_file: ".agent-progress/P0__identity-agent.md"

      acceptance_checks:
        - "'npm run dev' starts on port 3950 with no errors in terminal."
        - "Browser loads http://localhost:3950 and renders the Director shell with amber/gold sidebar accent and placeholder pages."
        - "Sidebar shows exactly 7 nav items: Clients, Engagements, Discovery, Scaffolding, OCAI, Terminology, Settings."
        - "'npm run build' exits with code 0, zero TypeScript errors, zero lint warnings."
        - "grep -r 'issue-reporter\\|issue-scoring\\|agents-skills\\|dev-portal\\|IdeaDetailPage\\|CharterViewPage\\|agent-connection\\|abstraction-layer\\|permissions\\|scoring\\|useIdeaTimeline\\|useAgentConnection' src/ returns no results."
        - "No references to removed store files (ideas.ts, charters.ts, activity.ts, agent-sessions.ts, dev-settings.ts) in any import statement."
        - "mock-server/ directory does not exist."
        - "public/level-set-logo.svg does not exist."
        - "src/types/index.ts does not exist (will be recreated in P1)."
        - "VITE_USE_MOCK_DATA=true is set in .env."
        - "vite.config.ts server.port is 3950."

      required_commands:
        - "npm install"
        - "npx tsc --noEmit"
        - "npm run lint"
        - "npm run build"
        - "npm run dev"

      phase_closeout:
        docs:
          - "Update README.md: replace Control description with Director description, update port to 3950, update setup instructions."
          - "Add CHANGELOG.md entry: '## [0.1.0] — P0: Clone and strip Control, establish Director identity.'"
        git:
          - "git add -A"
          - "git commit -m \"phase(P0): clone-and-strip Control, establish Director identity on port 3950\""
          - "git push origin HEAD"
        human_review: >
          Review: (1) Shell renders correctly in browser with amber accent.
          (2) All 7 nav items present and routing to placeholder pages.
          (3) Build is clean. Confirm before proceeding to P1.

    # ─────────────────────────────────────────────
    # P1 — Domain Types, Zustand Stores, Sample Data
    # ─────────────────────────────────────────────
    - id: "P1"
      name: "Domain Types, Zustand Stores, and Sample Data"
      goal: "Define all Director domain interfaces and enums, implement all Zustand persist stores with CRUD operations, and seed comprehensive mock data for both fictional clients."
      parallel_workstreams:
        - agent: "types-agent"
          depends_on: []
          tasks:
            - "Create src/types/index.ts with all Director domain interfaces and enums."
            - "Define ClientStatus enum: prospect | discovery | scaffolding | building | active | archived."
            - "Define ClientSizeRange enum: small | mid | large."
            - "Define Client interface: id (string uuid), name, industry, size_range (ClientSizeRange), status (ClientStatus), primary_contact, notes, created_at (string ISO), updated_at (string ISO)."
            - "Define EngagementPhase enum: discovery | scaffolding | first_build | handoff | subscription."
            - "Define EngagementStatus enum: active | paused | complete."
            - "Define Engagement interface: id, client_id, phase (EngagementPhase), start_date, target_end_date (string | null), actual_end_date (string | null), status (EngagementStatus)."
            - "Define DiscoverySessionType enum: stakeholder_interview | system_walkthrough | workflow_observation | brand_collection."
            - "Define DiscoverySessionStatus enum: scheduled | in_progress | complete | reviewed."
            - "Define DiscoverySession interface: id, engagement_id, session_type (DiscoverySessionType), title, participants (string[]), transcript (string), extracted_data (Record<string, unknown>), scaffolding_sections_affected (string[]), status (DiscoverySessionStatus), session_date (string ISO)."
            - "Define ScaffoldingValidationStatus enum: draft | review | validated | exported."
            - "Define ScaffoldingPackage interface: id, engagement_id, version (string semver), tier1_process_workflow (Record<string,unknown>), tier1_culture_profile (Record<string,unknown>), tier1_data_systems (Record<string,unknown>), tier2_company_context (Record<string,unknown>), tier2_brand_standards (Record<string,unknown>), tier2_tech_preferences (Record<string,unknown>), tier2_quality_standards (Record<string,unknown>), tier2_security_patterns (Record<string,unknown>), validation_status (ScaffoldingValidationStatus), exported_at (string | null)."
            - "Define OCAILevel enum: baseline_1 | workflow_2 | idea_3."
            - "Define OCAIStatus enum: draft | deployed | collecting | complete | analyzed."
            - "Define OCAIAssessment interface: id, engagement_id, level (OCAILevel), target_scope (string), questions (Record<string,unknown>[]), responses (Record<string,unknown>[]), analysis (Record<string,unknown>), status (OCAIStatus)."
            - "Define TerminologyEntry interface: id, scaffolding_id, client_term, universal_concept, context, source_session_id (string | null)."
            - "Define SectionCompletionStatus enum: empty | draft | reviewed | validated."
            - "Export all types from src/types/index.ts."
          progress_file: ".agent-progress/P1__types-agent.md"

        - agent: "stores-agent"
          depends_on: ["types-agent"]
          tasks:
            - "Install zustand@5.x if not already present from Control. Confirm persist middleware is available."
            - "Create src/stores/clients.ts: Zustand persist store with key 'director-clients'. State: clients: Client[]. Actions: addClient(c: Omit<Client,'id'|'created_at'|'updated_at'>), updateClient(id: string, patch: Partial<Client>), deleteClient(id: string), setClients(clients: Client[]). Auto-generate uuid for id, set created_at/updated_at to new Date().toISOString() on creation."
            - "Create src/stores/engagements.ts: Zustand persist store with key 'director-engagements'. State: engagements: Engagement[]. Actions: addEngagement, updateEngagement, deleteEngagement, setEngagements, getEngagementsByClientId(clientId: string): Engagement[]."
            - "Create src/stores/discovery.ts: Zustand persist store with key 'director-discovery'. State: sessions: DiscoverySession[]. Actions: addSession, updateSession, deleteSession, setSessions, getSessionsByEngagementId(engagementId: string): DiscoverySession[]."
            - "Create src/stores/scaffolding.ts: Zustand persist store with key 'director-scaffolding'. State: packages: ScaffoldingPackage[]. Actions: addPackage, updatePackage, updateSection(packageId: string, tier: 'tier1'|'tier2', section: string, data: Record<string,unknown>), setPackages, getPackageByEngagementId(engagementId: string): ScaffoldingPackage | undefined."
            - "Create src/stores/ocai.ts: Zustand persist store with key 'director-ocai'. State: assessments: OCAIAssessment[]. Actions: addAssessment, updateAssessment, deleteAssessment, setAssessments, getAssessmentsByEngagementId(engagementId: string): OCAIAssessment[]."
            - "Create src/stores/terminology.ts: Zustand persist store with key 'director-terminology'. State: entries: TerminologyEntry[]. Actions: addEntry, updateEntry, deleteEntry, setEntries, getEntriesByScaffoldingId(scaffoldingId: string): TerminologyEntry[]."
            - "Create src/stores/settings.ts: Zustand persist store with key 'director-settings'. State: openrouter_api_key: string, selected_models: Record<string, string> (keyed by function name), mock_mode: boolean. Actions: setApiKey, setModel(fn: string, model: string), setMockMode. Initialize mock_mode from import.meta.env.VITE_USE_MOCK_DATA === 'true'."
            - "Export each store as a named hook: useClientsStore, useEngagementsStore, useDiscoveryStore, useScaffoldingStore, useOcaiStore, useTerminologyStore, useSettingsStore."
          progress_file: ".agent-progress/P1__stores-agent.md"

        - agent: "sample-data-agent"
          depends_on: ["stores-agent"]
          tasks:
            - "Create src/lib/sample-data.ts exporting a seedSampleData() function that populates all stores via setClients, setEngagements, setSessions, setPackages, setAssessments, setEntries."
            - "Seed Client 1 — Precision Dynamics: id='client-precision', mid-size manufacturer, 180 employees (encode in notes), status=scaffolding, industry='Manufacturing'."
            - "Seed Client 2 — Midwest Distribution Co: id='client-midwest', distributor, 95 employees, status=discovery, industry='Distribution'."
            - "Seed Engagement for Precision Dynamics: id='eng-precision-1', phase=scaffolding, status=active, start_date='2026-01-15'."
            - "Seed Engagement for Midwest Distribution: id='eng-midwest-1', phase=discovery, status=active, start_date='2026-02-10'."
            - "Seed 3 completed DiscoverySessions for Precision Dynamics (stakeholder_interview, system_walkthrough, workflow_observation) with realistic transcript strings (200+ chars each) and populated extracted_data objects."
            - "Seed 2 DiscoverySessions for Midwest Distribution: one complete (stakeholder_interview), one in_progress (brand_collection)."
            - "Seed 6 total session transcripts inline in sample-data.ts (one per session)."
            - "Seed ScaffoldingPackage for Precision Dynamics: id='scaffolding-precision-1', all 8 tier sections populated with realistic JSON objects (key-value process/culture/data/context/brand/tech/quality/security fields), validation_status=validated."
            - "Seed ScaffoldingPackage for Midwest Distribution: id='scaffolding-midwest-1', tier1 sections partially populated, tier2 sections empty objects, validation_status=draft."
            - "Seed OCAIAssessment L1 for Precision Dynamics: status=analyzed, analysis populated with CVF quadrant scores (clan, adhocracy, hierarchy, market each 0–100)."
            - "Seed OCAIAssessment L2 for Precision Dynamics: status=collecting, questions array with 6 questions."
            - "Seed OCAIAssessment L1 for Midwest Distribution: status=deployed, questions array with 10 questions, responses empty array."
            - "Seed 30+ TerminologyEntry records for Precision Dynamics scaffolding (covering ERP terms, shop floor language, organizational roles) — at minimum: 10 ERP terms, 10 shop floor terms, 10 role terms."
            - "In App.tsx: import seedSampleData, import all store hooks, add DATA_VERSION = 1 constant, on app mount check localStorage key 'director-data-version', if missing or !== DATA_VERSION call seedSampleData() then set the version key."
          progress_file: ".agent-progress/P1__sample-data-agent.md"

      acceptance_checks:
        - "src/types/index.ts exists and exports Client, Engagement, DiscoverySession, ScaffoldingPackage, OCAIAssessment, TerminologyEntry and all associated enums."
        - "All 7 Zustand stores exist in src/stores/ and use 'director-' prefixed localStorage keys."
        - "npx tsc --noEmit passes with zero errors after stores and types are created."
        - "npm run dev — open browser localStorage in DevTools and confirm 'director-clients' key exists with 2 client records after first load."
        - "localStorage 'director-scaffolding' contains a package for Precision Dynamics with all 8 sections non-empty."
        - "localStorage 'director-terminology' contains 30+ entries for scaffolding-precision-1."
        - "Incrementing DATA_VERSION in App.tsx, reloading the app, and inspecting localStorage confirms all stores are re-seeded from scratch."
        - "npm run build exits 0 with zero TypeScript errors."

      required_commands:
        - "npx tsc --noEmit"
        - "npm run lint"
        - "npm run build"

      phase_closeout:
        docs:
          - "Add CHANGELOG.md entry: '## [0.2.0] — P1: Domain types, Zustand stores, comprehensive sample data seeded.'"
        git:
          - "git add -A"
          - "git commit -m \"phase(P1): domain types, 7 zustand persist stores, sample data seeding with DATA_VERSION guard\""
          - "git push origin HEAD"
        human_review: >
          Review: (1) Open DevTools localStorage — confirm all 'director-' keys are present with populated data.
          (2) Increment DATA_VERSION, reload, confirm re-seed. (3) TypeScript and build clean.
          Confirm before proceeding to P2.

    # ─────────────────────────────────────────────
    # P2 — App Shell, Routing, and Settings Page
    # ─────────────────────────────────────────────
    - id: "P2"
      name: "App Shell, Routing, and Settings Page"
      goal: "Wire all 7 routes to real page components within the Director shell and deliver a fully functional Settings page."
      parallel_workstreams:
        - agent: "shell-agent"
          depends_on: []
          tasks:
            - "Confirm AppShell.tsx renders correctly with Director amber/gold accent on the active nav item and sidebar footer branding."
            - "In App.tsx, replace all placeholder <div> page components with imports of the real page components (to be created by page agents). For now, ensure the route structure is declared with React.lazy and Suspense so page components can be dropped in without re-touching App.tsx."
            - "Add a root redirect: '/' → '/clients'."
            - "Add a 404 catch-all route that renders a simple 'Page not found' component."
            - "Verify Sidebar.tsx highlights the correct nav item based on the current route using NavLink from React Router."
            - "Confirm backdrop-blur-sm + bg-card/50 glassmorphism effect on Sidebar and AppShell is intact from Control."
          progress_file: ".agent-progress/P2__shell-agent.md"

        - agent: "settings-agent"
          depends_on: []
          tasks:
            - "Create src/pages/SettingsPage.tsx."
            - "Section 1 — AI Provider: labeled 'OpenRouter API Key' input (type=password, show/hide toggle), saves to useSettingsStore.setApiKey() on blur or explicit Save button. Below key input, a model-selection row for each AI function used in Director (interview_wizard, ocai_builder, extraction). Each row: function label + select dropdown showing common OpenRouter model IDs (anthropic/claude-sonnet-4-5, anthropic/claude-haiku, openai/gpt-4o-mini as options)."
            - "Section 2 — Mock Data: read-only display of import.meta.env.VITE_USE_MOCK_DATA. If true, show a yellow badge 'MOCK MODE — AI calls are simulated'. If false, show a green badge 'LIVE MODE'."
            - "Section 3 — About: 'Director' title, version string read from package.json (import via Vite's JSON import), build date placeholder string."
            - "Apply shadcn/ui Card, Input, Select, Badge, Button primitives. Apply glassmorphism card style (bg-card/50 backdrop-blur-sm). Use amber accent for section headers."
            - "Write a Vitest smoke test in src/pages/SettingsPage.test.tsx: render SettingsPage, assert 'OpenRouter API Key' label is present, assert mock mode badge renders."
          progress_file: ".agent-progress/P2__settings-agent.md"

      acceptance_checks:
        - "Navigating to http://localhost:3950/ redirects to /clients."
        - "All 7 nav items route without crashing (placeholder or real page renders)."
        - "Active nav item in Sidebar has amber/gold highlight class."
        - "Settings page at /settings renders all 3 sections."
        - "Entering an API key in Settings and reloading confirms key persists in localStorage under 'director-settings'."
        - "MOCK MODE badge is visible when VITE_USE_MOCK_DATA=true."
        - "Vitest: 'npm run test' passes for SettingsPage.test.tsx."
        - "npm run build exits 0."

      required_commands:
        - "npx tsc --noEmit"
        - "npm run lint"
        - "npm run test"
        - "npm run build"

      phase_closeout:
        docs:
          - "Add CHANGELOG.md entry: '## [0.3.0] — P2: Full routing, Director shell verified, Settings page complete.'"
        git:
          - "git add -A"
          - "git commit -m \"phase(P2): routing, shell verified, settings page with api key + mock mode indicator\""
          - "git push origin HEAD"
        human_review: >
          Review: (1) Navigate all 7 routes — no crashes. (2) Settings page — save an API key, reload,
          confirm persistence. (3) MOCK MODE badge visible. Confirm before P3.

    # ─────────────────────────────────────────────
    # P3 — Clients Page
    # ─────────────────────────────────────────────
    - id: "P3"
      name: "Clients Page"
      goal: "Deliver a fully functional Clients page with list view, filtering, sorting, detail panel, create form, and status progression visualization."
      parallel_workstreams:
        - agent: "clients-list-agent"
          depends_on: []
          tasks:
            - "Create src/pages/ClientsPage.tsx as the page root, orchestrating list and detail panel."
            - "Create src/components/clients/ClientList.tsx: renders a list/table of clients from useClientsStore. Columns: Name, Industry, Size, Status badge, Primary Contact, Last Updated."
            - "Add filter bar above list: status filter (dropdown — All / prospect / discovery / scaffolding / building / active / archived) and text search (filters by name and industry)."
            - "Add sort controls: sortable by Name (A–Z / Z–A), Status, Updated date."
            - "Status badges use semantic colors: prospect=gray, discovery=sky, scaffolding=amber, building=blue, active=emerald, archived=neutral."
            - "Clicking a client row opens a ClientDetailPanel (slide-in or right-panel layout using shadcn/ui Sheet or a custom panel)."
            - "Create src/components/clients/ClientDetailPanel.tsx: shows client name, industry, size, primary contact, notes. Shows list of engagements for this client (from useEngagementsStore.getEngagementsByClientId). Shows current phase badge. Provides quick-action buttons: 'View Discovery', 'View Scaffolding', 'View OCAI' — navigate to those pages filtered to this client's active engagement."
            - "Create src/components/clients/ClientStatusProgression.tsx: horizontal stepper visualization showing the 6 statuses (prospect → discovery → scaffolding → building → active [archived as off-path]). Current status highlighted in amber. Clicking a step calls updateClient with new status after a window.confirm prompt."
            - "Create src/components/clients/NewClientForm.tsx (inside a shadcn/ui Dialog): fields for name (required), industry, size_range (Select), primary_contact, notes (Textarea). On submit calls addClient and closes dialog. Validate: name must be non-empty."
