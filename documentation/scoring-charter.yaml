# ============================================================================
# StageManager — Issue Scoring & Auto-Remediation Charter
# ============================================================================
# Version: 1.0.0
# Date: 2025-02-25
#
# This charter governs the build of the issue scoring engine and
# auto-remediation trigger system for StageManager. Issues (bugs and
# feature requests) are children of ideas — every issue belongs to a
# parent project. The scoring engine evaluates issues in the context of
# their parent project's charter, scaffolding, and existing issue history.
#
# Bugs that exceed configurable thresholds can automatically trigger
# agentic coding remediation attempts through StageManager's development
# portal. The system uses a three-tier threshold model with admin-
# configurable boundaries and target environments.
#
# StageManager is a pure frontend application. All persistence uses
# mock data / localStorage until BackStage integration is implemented.
# ============================================================================

charter:
  project: "StageManager Issue Scoring & Auto-Remediation"
  repo: "stage-manager"
  charter_version: "1.0.0"
  charter_date: "2025-02-25"

  description: >
    A scoring engine for issues (bugs and feature requests) filed against
    StageManager projects, plus a threshold-based system that can
    automatically trigger agentic coding remediation for high-scoring bugs.
    Issues are always children of an idea (project). Scoring evaluates each
    issue in the context of its parent project's charter execution plan,
    scaffolding, and existing issue history. The auto-remediation system
    uses three configurable tiers: file only, recommend fix, and
    auto-trigger. Tier thresholds and target environments are managed by
    admins in the settings panel.

  owners:
    product_owner: "IT / Operations"
    tech_owner: "IT"

  # ==========================================================================
  # ARCHITECTURAL CONTEXT
  # ==========================================================================

  architecture:
    parent_child_model: >
      Ideas are the top-level entity in StageManager. Issues (bugs and
      feature requests) are children of ideas. Every issue has a parent
      project — there are no orphan issues. The issue reporter AI
      establishes the parent project during the intake conversation.
    scoring_trigger: >
      Scoring runs automatically when a new issue is submitted through
      the issue reporter. Scores can also be recalculated manually or
      when issue fields are updated (e.g., new information added via
      comments, severity changed).
    remediation_trigger: >
      When a bug's composite score crosses a configured threshold, the
      system either recommends or auto-initiates an agentic coding
      session through the existing development portal infrastructure.
      The remediation uses the parent project's charter and scaffolding
      as context, plus the structured bug report as the task definition.
    backend: >
      StageManager is frontend-only. Scoring runs client-side using the
      AI model configured in admin settings (via OpenRouter). All data
      uses localStorage / Zustand stores until BackStage is implemented.

  # ==========================================================================
  # NON-NEGOTIABLES
  # ==========================================================================

  non_negotiables:
    - "Every issue must have a parent idea/project. Scoring always happens in the context of that parent."
    - "Bug scoring and feature request scoring use different dimension sets — they are not the same evaluation."
    - "Auto-remediation only applies to bugs. Feature requests are never auto-triggered."
    - "Auto-remediation never targets the Production environment without explicit human approval."
    - "Threshold tiers and target environments are admin-configurable, not hardcoded."
    - "The scoring engine must function with mock data when no AI model is configured (rules-based fallback)."
    - "Scoring results are transparent — the user can see how each dimension was evaluated and why."
    - "Do not modify the idea scoring engine. Issue scoring is a separate system."

  # ==========================================================================
  # BUG SCORING ENGINE
  # ==========================================================================

  bug_scoring:
    description: >
      Evaluates bugs across five dimensions to produce a composite score.
      The score determines triage priority and whether the bug qualifies
      for automated remediation. Scoring uses AI analysis of the structured
      bug report combined with project context. Falls back to rules-based
      heuristics when AI is unavailable.

    dimensions:

      severity:
        weight: 0.25
        range: 0-100
        description: >
          How severe is the impact of this bug? Derived primarily from
          the AI's severity classification during intake, but adjusted
          by contextual factors.
        scoring_logic:
          ai_approach: >
            The AI evaluates the bug description, expected vs actual
            behavior, and conversation context against the project's
            quality standards from the scaffolding. It considers whether
            the bug involves data loss, security exposure, complete
            feature failure, or cosmetic issues.
          rules_fallback:
            critical: 95
            high: 75
            medium: 50
            low: 25
          adjustments:
            - "Data loss or corruption mentioned: +15"
            - "Security implications mentioned: +15"
            - "Workaround available (from conversation): -10"
            - "Intermittent / hard to reproduce: -5"

      blast_radius:
        weight: 0.25
        range: 0-100
        description: >
          How many users and how much of the application is affected?
          A bug in a shared foundational component scores higher than a
          bug in a peripheral settings page. Derived by mapping the
          affected area against the charter's component hierarchy.
        scoring_logic:
          ai_approach: >
            The AI maps the affected_area from the bug report against
            the parent project's charter execution plan. It evaluates:
            is this a core component or a peripheral feature? Is it
            on the critical path? How many other components depend on
            it? How many users interact with this part of the app daily?
          rules_fallback:
            - "Affected area matches a Phase 1 / core component in charter: 85"
            - "Affected area matches a secondary component: 60"
            - "Affected area matches a settings / admin component: 35"
            - "Affected area unknown or not in charter: 50 (neutral)"
          adjustments:
            - "Bug reporter mentioned 'everyone' or 'all users': +15"
            - "Bug reporter mentioned 'just me' or single user: -20"
            - "Affected area is a shared/foundational component in charter: +10"

      reproducibility:
        weight: 0.20
        range: 0-100
        description: >
          How reliably can this bug be reproduced? Directly impacts
          whether automated remediation has a reasonable chance of
          success. Derived from the conversation data — frequency,
          clarity of steps, and specificity of expected vs actual
          behavior.
        scoring_logic:
          ai_approach: >
            The AI evaluates the quality and completeness of the
            structured bug report: Are the steps to reproduce specific
            and sequential? Is the expected behavior clearly defined?
            Is the actual behavior concrete (not vague)? Did the user
            indicate consistent occurrence?
          rules_fallback:
            - "Steps to reproduce present AND frequency is 'every time': 90"
            - "Steps to reproduce present AND frequency is 'most of the time': 75"
            - "Steps to reproduce present AND frequency is 'occasionally': 55"
            - "No steps to reproduce but description is detailed: 40"
            - "Vague description, no steps: 20"
            - "Happened once, cannot reproduce: 10"
          adjustments:
            - "Screenshot attached with visible error: +10"
            - "Error message captured in metadata: +10"
            - "User confirmed steps reproduce the issue: +5"

      remediation_confidence:
        weight: 0.20
        range: 0-100
        description: >
          How likely is an automated agent to successfully fix this bug?
          This is the dimension that makes the system intelligent rather
          than just reactive. Evaluates the feasibility of an automated
          fix based on project documentation quality, component isolation,
          test coverage, and bug complexity.
        scoring_logic:
          ai_approach: >
            The AI evaluates the intersection of the bug report and the
            project context: Is the affected component well-documented
            in the charter? Does the execution plan describe the
            component's architecture? Are there acceptance criteria or
            test descriptions the agent can validate against? Is the
            bug in an isolated component or does it touch cross-cutting
            concerns? Is the fix likely a localized change or does it
            require understanding complex state interactions?
          rules_fallback:
            - "Affected area has detailed charter documentation: 75"
            - "Affected area has minimal charter documentation: 45"
            - "Affected area not documented in charter: 20"
          adjustments:
            - "Bug appears to be in a single isolated component: +15"
            - "Bug involves cross-component interaction: -15"
            - "Bug involves data layer or API integration: -10"
            - "Bug is visual/UI only: +10"
            - "Similar bug was previously fixed successfully (check history): +20"
            - "Previous remediation attempt failed for similar bug: -25"

      recurrence:
        weight: 0.10
        range: 0-100
        description: >
          Has this bug or something similar been reported before? Recurring
          bugs score higher because they represent persistent problems and
          because previous reports provide additional context that can
          improve remediation accuracy.
        scoring_logic:
          ai_approach: >
            The AI checks the existing issues for the parent project.
            It looks for issues with similar affected areas, similar
            descriptions, or that were identified as potential duplicates
            during the intake conversation. It also checks whether any
            previously resolved issues in the same area have been
            reopened or had new reports filed.
          rules_fallback:
            - "Duplicate detected during intake (user confirmed 'different'): 80"
            - "Similar issue exists in same affected area (resolved): 60"
            - "Similar issue exists in same affected area (open): 70"
            - "No similar issues found: 30"
            - "First issue ever filed for this project: 10"

    composite_score:
      calculation: weighted_average
      range: 0-100
      tiers:
        critical: 80-100
        high: 60-79
        medium: 40-59
        low: 0-39

  # ==========================================================================
  # FEATURE REQUEST SCORING ENGINE
  # ==========================================================================

  feature_scoring:
    description: >
      Evaluates feature requests to help prioritize them within the
      parent project's development backlog. Feature requests never
      trigger auto-remediation. Scoring is displayed on the issue
      detail and in the parent project's production health portal to
      inform development planning.

    dimensions:

      demand:
        weight: 0.30
        range: 0-100
        description: >
          How many people want this? Derived from the number of similar
          requests, the breadth of impact described in the conversation,
          and whether the request addresses a common workflow.
        scoring_logic:
          ai_approach: >
            The AI evaluates the conversation for signals of broad
            demand: does the user describe a team-wide need, a personal
            preference, or an organizational gap? It checks existing
            issues for similar feature requests to gauge whether this
            has been asked for before.
          rules_fallback:
            - "Similar feature request already exists: 75"
            - "Multiple similar requests exist: 90"
            - "User describes team-wide impact: 65"
            - "User describes personal preference: 30"
            - "No similar requests found: 40"

      alignment:
        weight: 0.30
        range: 0-100
        description: >
          How well does this feature request align with the project's
          stated objectives and the organization's strategic direction?
          Derived from the charter's objectives and the scaffolding's
          company context.
        scoring_logic:
          ai_approach: >
            The AI compares the desired outcome described in the feature
            request against the parent project's charter objectives,
            acceptance criteria, and the scaffolding's company context.
            Features that extend the charter's original vision score
            higher than features that pull the project in a new direction.
          rules_fallback:
            - "Desired outcome directly maps to a charter objective: 85"
            - "Desired outcome is adjacent to charter objectives: 60"
            - "Desired outcome is unrelated to charter objectives: 30"

      complexity:
        weight: 0.20
        range: 0-100
        description: >
          How complex would this feature be to implement? Inversely
          scored — simpler features score higher because they represent
          better value for effort. Estimated from the charter's
          technical approach and component architecture.
        scoring_logic:
          ai_approach: >
            The AI evaluates the feature request against the project's
            charter execution plan. Can this be achieved by modifying
            an existing component, or does it require new architecture?
            Does it affect the data model? Does it require new
            integrations? Simple extensions of existing patterns score
            highest.
          rules_fallback:
            - "Appears to be a minor UI change or configuration: 85"
            - "Extends existing component with new option: 70"
            - "Requires new component but within existing architecture: 50"
            - "Requires new data model or integration: 30"
            - "Requires significant architectural changes: 15"
          note: "Inverse scoring — higher score means LESS complex (more feasible)"

      impact:
        weight: 0.20
        range: 0-100
        description: >
          How much would this feature improve the user experience or
          operational efficiency? Derived from the conversation's
          description of the desired outcome and its practical effects.
        scoring_logic:
          ai_approach: >
            The AI evaluates the practical impact described in the
            conversation: does this save time, reduce errors, enable
            new capabilities, or improve usability? How frequently
            would the improved workflow be used?
          rules_fallback:
            - "Addresses daily workflow friction: 80"
            - "Enables new capability not currently possible: 70"
            - "Improves occasional workflow: 50"
            - "Cosmetic or convenience improvement: 30"

    composite_score:
      calculation: weighted_average
      range: 0-100
      tiers:
        high_value: 75-100
        moderate_value: 50-74
        low_value: 25-49
        minimal_value: 0-24
      note: >
        Feature tiers use different labels than bug tiers to avoid
        confusion. A "critical" feature request doesn't have the same
        urgency implications as a "critical" bug.

  # ==========================================================================
  # AUTO-REMEDIATION THRESHOLD SYSTEM
  # ==========================================================================

  auto_remediation:
    description: >
      A three-tier threshold system that determines what happens when a
      bug is scored. Thresholds and target environments are configurable
      by admins in the StageManager settings panel. Auto-remediation
      only applies to bugs — feature requests are never auto-triggered.

    applies_to: bugs_only

    tiers:
      file_only:
        description: >
          The bug is filed, scored, and displayed in the issues view
          and production health portal. No automated action is taken.
          A developer reviews and decides what to do. This is the
          default behavior for all bugs below the recommendation
          threshold.
        trigger: "composite_score < recommend_threshold"
        action: >
          Issue created, score displayed, appears in priority queue.
          No notification beyond the standard activity feed entry.

      recommend_fix:
        description: >
          The bug scores high enough that the system recommends an
          automated remediation attempt. A notification appears in
          the dashboard and on the issue detail indicating that
          auto-remediation is recommended. A developer reviews the
          recommendation and clicks to approve, which initiates an
          agentic coding session through the development portal.
        trigger: "composite_score >= recommend_threshold AND composite_score < auto_trigger_threshold"
        action:
          - "Issue created with 'remediation-recommended' flag"
          - "Notification card appears on the dashboard activity feed: 'Auto-fix recommended for [title]'"
          - "Issue detail shows a prominent 'Approve Auto-Fix' action button"
          - "On approval: developer selects target environment (DSP or Development) and the system initiates a build session"
          - "The build session uses the bug report as the task definition and the parent charter + scaffolding as context"

      auto_trigger:
        description: >
          The bug scores above the auto-trigger threshold. The system
          automatically initiates a remediation attempt in the configured
          target environment (default: DSP) without waiting for human
          approval. The developer is notified that a fix is in progress
          and can monitor, pause, or stop it through the development
          portal.
        trigger: "composite_score >= auto_trigger_threshold"
        action:
          - "Issue created with 'auto-remediation-triggered' flag"
          - "Notification card on dashboard: 'Auto-fix triggered for [title] — building in [environment]'"
          - "Agentic coding session initiated automatically in the configured target environment"
          - "Issue detail shows live development portal feed for the remediation session"
          - "Developer can pause or stop the session at any time"
          - "On completion: fix is staged for review, NOT auto-deployed beyond the target environment"

    safety_rules:
      - "Auto-trigger NEVER targets the Production environment. Production deployments always require human review and manual status advancement."
      - "If the configured target environment is disconnected or in error state, auto-trigger falls back to recommend_fix behavior."
      - "If an auto-triggered remediation fails (agent error or stop), the issue is flagged as 'remediation-failed' and falls back to manual triage."
      - "A maximum of one auto-remediation session can run per project at a time. Additional qualifying bugs queue behind the active session."
      - "If remediation_confidence dimension scores below 40, the bug cannot auto-trigger regardless of composite score. It falls back to recommend_fix at most."
      - "Admins can disable auto-remediation entirely via a master toggle in settings."

    remediation_context:
      description: >
        When a remediation session is initiated (manually approved or
        auto-triggered), the system assembles a task package for the
        agentic coding agent. This package gives the agent everything
        it needs to understand and fix the bug.
      package_contents:
        - parent_charter: "The parent project's full charter and execution plan"
        - scaffolding: "The relevant scaffolding documents (tech preferences, quality standards, security patterns)"
        - bug_report: "The structured bug report (title, description, steps to reproduce, expected/actual behavior, affected area)"
        - conversation_summary: "The AI intake conversation summary for additional context"
        - screenshot: "The annotated screenshot if one was attached"
        - related_issues: "Any issues the scoring engine identified as related (for context, not for fixing)"
        - remediation_instructions: >
            A system prompt instructing the agent to: read the bug report,
            locate the affected component using the charter as a map,
            reproduce the issue if possible, implement a fix, verify the
            fix against the expected behavior, and run any existing tests.
            The agent should not modify code outside the affected area
            unless necessary for the fix.

  # ==========================================================================
  # ADMIN CONFIGURATION
  # ==========================================================================

  admin_settings:
    description: >
      The auto-remediation settings are managed in the StageManager admin
      panel. These should be added as a new section within the existing
      admin interface, either as a new tab or as a sub-section of an
      existing tab.

    location: "Admin panel — new tab or section"
    label: "Issue Scoring & Remediation"

    settings:
      master_toggle:
        label: "Auto-Remediation"
        type: toggle
        default: true
        description: >
          Master switch for the entire auto-remediation system. When
          disabled, all bugs are scored but no automated actions are
          taken regardless of score. Recommend and auto-trigger tiers
          are inactive.

      recommend_threshold:
        label: "Recommendation Threshold"
        type: slider
        range: [0, 100]
        default: 60
        description: >
          Bugs scoring at or above this value are flagged with a
          remediation recommendation. The developer sees a prompt to
          approve an auto-fix.

      auto_trigger_threshold:
        label: "Auto-Trigger Threshold"
        type: slider
        range: [0, 100]
        default: 80
        description: >
          Bugs scoring at or above this value automatically initiate
          a remediation attempt. Must be higher than the recommendation
          threshold.
        validation: "Must be greater than recommend_threshold"

      auto_trigger_environment:
        label: "Auto-Trigger Target Environment"
        type: select
        options: ["dsp", "development"]
        default: "dsp"
        description: >
          Which environment auto-triggered remediation sessions target.
          Production is intentionally excluded — production deployments
          always require human review.
        note: "Production is not an option. This is by design."

      remediation_confidence_floor:
        label: "Minimum Remediation Confidence"
        type: slider
        range: [0, 100]
        default: 40
        description: >
          Bugs with a remediation_confidence dimension score below this
          value cannot auto-trigger, regardless of composite score.
          They can still receive a recommendation if the composite
          score qualifies.

      max_concurrent_sessions:
        label: "Max Concurrent Remediation Sessions"
        type: number
        range: [1, 5]
        default: 1
        description: >
          Maximum number of auto-remediation sessions that can run
          simultaneously across all projects. Additional qualifying
          bugs queue until a slot is available.

      bug_dimension_weights:
        label: "Bug Scoring Weights"
        type: weight_sliders
        description: >
          Adjust the relative weight of each scoring dimension for bugs.
          Weights must sum to 1.0. This allows the admin to tune the
          scoring to their organization's priorities — a team that values
          fix reliability might increase remediation_confidence weight,
          while a team focused on user impact might increase blast_radius.
        defaults:
          severity: 0.25
          blast_radius: 0.25
          reproducibility: 0.20
          remediation_confidence: 0.20
          recurrence: 0.10
        constraint: "All weights must sum to 1.0"

      feature_dimension_weights:
        label: "Feature Scoring Weights"
        type: weight_sliders
        description: >
          Adjust the relative weight of each scoring dimension for
          feature requests.
        defaults:
          demand: 0.30
          alignment: 0.30
          complexity: 0.20
          impact: 0.20
        constraint: "All weights must sum to 1.0"

  # ==========================================================================
  # SCORE DISPLAY
  # ==========================================================================

  score_display:
    description: >
      How and where scores are rendered in the StageManager UI. Scoring
      visuals are consistent with the idea scoring display but use
      distinct color treatments to avoid confusion.

    locations:
      issue_detail:
        description: >
          The primary score display. Shows the composite score prominently
          with a full dimension breakdown. Each dimension rendered as a
          horizontal bar with its individual score, weight, and a brief
          AI-generated explanation of why it scored that way. The
          composite score uses tier-based color coding.
        elements:
          - composite_score:
              display: "Large number with tier badge"
              colors:
                critical: "semantic: error (red)"
                high: "amber/orange"
                medium: "semantic: queued (blue)"
                low: "semantic: idle (muted)"
                # Feature tiers
                high_value: "semantic: completed (green)"
                moderate_value: "semantic: queued (blue)"
                low_value: "semantic: idle (muted)"
                minimal_value: "muted/faded"
          - dimension_bars:
              display: "Horizontal bars, one per dimension"
              label: "Dimension name + weight percentage"
              score: "Numeric score at end of bar"
              explanation: "AI-generated one-liner below the bar explaining the score"
          - remediation_status:
              display: "Only visible for bugs"
              states:
                below_threshold: "No indicator"
                recommended: "Amber banner: 'Auto-fix recommended' with approve button"
                auto_triggered: "Teal banner: 'Auto-fix in progress' with link to dev portal"
                remediation_failed: "Red banner: 'Auto-fix attempted — manual review needed'"
                remediation_complete: "Green banner: 'Auto-fix complete — review staged changes'"

      issue_list:
        description: >
          Compact score display in the issues view table. Shows the
          composite score as a small colored badge next to the severity
          badge. Sortable by score.
        display: "Numeric badge with tier color, e.g., [82] in red"

      production_health:
        description: >
          The production portal's issue feed shows scores inline.
          Additionally, a new metric can be added to the health
          indicators showing the average bug score for the project —
          a rising average suggests growing technical debt.
        new_metric:
          label: "Avg Bug Score"
          display: "number"
          color_coding: >
            Green (avg < 40), Amber (40-60), Red (> 60). A high average
            means the bugs being reported are increasingly severe and
            reproducible, which is a signal that the codebase needs
            attention.

      dashboard:
        description: >
          The dashboard activity feed shows remediation events. The
          priority queue displays issues sorted by composite score
          alongside ideas sorted by their own scores, clearly
          distinguished by type badges.

  # ==========================================================================
  # DATA MODEL
  # ==========================================================================

  data_model:
    storage: "localStorage via Zustand (BackStage-ready interfaces)"

    issue_score:
      description: >
        Scoring data attached to each issue. Stored as part of the issue
        record or as a related object — either approach works as long
        as the interface supports BackStage migration.
      fields:
        - issue_id: string
        - score_type: enum              # bug, feature
        - composite_score: number       # 0-100
        - tier: enum                    # critical/high/medium/low (bugs) or high_value/moderate_value/low_value/minimal_value (features)
        - dimensions: dimension_score[]
        - remediation_status: enum | null  # null, recommended, approved, triggered, in_progress, completed, failed
        - remediation_session_id: string | null  # Links to agent session if remediation initiated
        - scored_at: datetime
        - scored_by: enum               # ai, rules_fallback

    dimension_score:
      fields:
        - dimension: string             # severity, blast_radius, reproducibility, etc.
        - score: number                 # 0-100
        - weight: number                # 0.0-1.0
        - weighted_score: number        # score * weight
        - explanation: string           # AI-generated one-liner

    remediation_settings:
      description: "Singleton config object for admin settings"
      fields:
        - enabled: boolean
        - recommend_threshold: number
        - auto_trigger_threshold: number
        - auto_trigger_environment: enum  # dsp, development
        - confidence_floor: number
        - max_concurrent_sessions: number
        - bug_weights: weight_map
        - feature_weights: weight_map

  # ==========================================================================
  # FILE STRUCTURE
  # ==========================================================================

  structure:
    src/modules/issue-scoring/:
      engine/:
        bug-scorer.ts: "Bug scoring logic — AI prompt construction, rules fallback, composite calculation"
        feature-scorer.ts: "Feature request scoring logic — same pattern, different dimensions"
        context-assembler.ts: "Gathers parent charter, scaffolding, and issue history for scoring context"
        score-calculator.ts: "Shared weighted average calculation and tier assignment"

      remediation/:
        threshold-evaluator.ts: "Evaluates scored bug against configured thresholds, returns tier action"
        remediation-trigger.ts: "Assembles remediation package and initiates agent session"
        remediation-monitor.ts: "Tracks active remediation sessions, handles completion/failure"
        session-queue.ts: "Manages concurrent session limits and queuing"

      components/:
        ScoreDisplay.tsx: "Full dimension breakdown with bars, explanations, and composite"
        ScoreBadge.tsx: "Compact score badge for list views"
        RemediationBanner.tsx: "Status banner for remediation state (recommended, in progress, etc.)"
        RemediationApproval.tsx: "Approval prompt with environment selector"
        ScoreWeightEditor.tsx: "Admin component for adjusting dimension weights"
        RemediationSettings.tsx: "Admin component for threshold and environment configuration"

      stores/:
        issue-scores.ts: "Zustand store for score data (BackStage-ready)"
        remediation-settings.ts: "Zustand store for admin remediation config"
        remediation-sessions.ts: "Zustand store for active/queued remediation sessions"

      types/:
        index.ts: "TypeScript interfaces for scores, dimensions, thresholds, remediation state"

  # ==========================================================================
  # PROTOTYPE SCOPE
  # ==========================================================================

  scope:
    included:
      - Bug scoring engine with five dimensions (severity, blast radius, reproducibility, remediation confidence, recurrence)
      - Feature request scoring engine with four dimensions (demand, alignment, complexity, impact)
      - AI-powered scoring via OpenRouter with rules-based fallback
      - AI-generated explanations for each dimension score
      - Composite score calculation with configurable weights
      - Three-tier threshold system (file only, recommend, auto-trigger)
      - Admin settings panel for thresholds, environments, weights, and master toggle
      - Remediation recommendation banner with approve action
      - Auto-trigger remediation with agent session initiation
      - Remediation package assembly (charter + scaffolding + bug report)
      - Session queue for concurrent session limits
      - Score display on issue detail (full breakdown), issue list (badge), and production health (avg score metric)
      - Dashboard activity feed entries for remediation events
      - Safety rules enforcement (no production auto-trigger, confidence floor, session limits)
      - Mock scoring for demo without API key
      - Mock remediation sessions for demo without live agent

    excluded:
      - BackStage API integration (mock data only)
      - Real agent connections (mock sessions only for prototype)
      - Post-remediation automated testing or validation
      - Automated deployment of fixes beyond the target environment
      - Historical score trending or analytics
      - Score-based SLA tracking
      - Email or external notifications for remediation events

    sample_data:
