# ============================================================================
# StageManager — Project Charter
# Client-Facing AI Development Operations Hub
# ============================================================================
# This charter governs the prototype build of StageManager, the client-facing
# application delivered as part of an AI consulting engagement. StageManager
# serves as the client's ongoing development operations hub for prioritizing
# work, generating charters and execution plans, and managing bugs and
# feature requests. It operates in conjunction with a scaffolding package
# produced during the initial consulting discovery process.
# ============================================================================

project:
  name: StageManager
  type: web-application
  stage: prototype
  description: >
    StageManager is a client-facing AI development operations hub. It is the
    central tool a client uses after an AI consulting engagement to manage
    their ongoing development lifecycle. Clients use it to capture process
    improvement ideas, score and prioritize application opportunities, generate
    project charters and execution plans for agentic coding tools, and track
    bugs and feature requests from end users. The scaffolding package produced
    during the consulting discovery process lives inside StageManager and
    governs all charter output.

# ============================================================================
# TECH STACK
# ============================================================================

stack:
  framework: react
  bundler: vite
  language: typescript
  css: tailwind-css-v3
  components: shadcn-ui-v2
  icons: lucide-react
  font: inter
  animations: pure-css # No Framer Motion. @keyframes and conic-gradient rotation.
  state: zustand # Lightweight, minimal boilerplate
  routing: react-router-dom
  api-client: anthropic-sdk # For charter generation via Claude API
  package-manager: npm

  notes:
    - Single Page Application, no SSR
    - Standard #root mount via Vite
    - shadcn/ui v2 uses full HSL token system with CSS custom properties
    - All colors defined as HSL values on :root enabling opacity modifiers

# ============================================================================
# DESIGN SYSTEM
# ============================================================================

design:
  philosophy: >
    Dark glassmorphism aesthetic. Elegant, not heavy. font-light everywhere.
    Color through gradients, not fills. Generous whitespace. The UI should
    feel like mission control — precise, calm, information-dense without
    feeling cluttered.

  palette:
    background: '225 64% 11%' # Deep navy, NOT pure black
    foreground: '220 14% 96%' # Near-white
    card: '225 50% 15%' # Slightly lighter navy
    card-foreground: '220 14% 96%'
    primary: '217 100% 61%' # Vivid blue
    primary-foreground: '0 0% 100%'
    secondary: '225 30% 25%'
    secondary-foreground: '220 14% 91%'
    muted: '225 30% 20%'
    muted-foreground: '220 14% 55%' # Grey text for descriptions
    accent: '225 40% 22%'
    accent-foreground: '220 14% 91%'
    destructive: '0 72% 51%'
    border: '225 30% 20%'
    input: '225 30% 20%'
    ring: '217 100% 61%'
    radius: '9999px' # Pill shape by default for buttons/badges

  semantic-colors:
    active: '175 63% 47%' # Teal — running/in-progress
    queued: '217 100% 61%' # Blue — waiting/primary
    completed: '142 71% 45%' # Green — success/done
    error: '0 72% 51%' # Red — failed/destructive
    idle: '225 30% 20%' # Muted — inactive

  gradient:
    stops:
      - 'hsl(217, 100%, 60%)' # Blue
      - 'hsl(175, 80%, 55%)' # Teal
      - 'hsl(263, 80%, 65%)' # Purple/Rose
    usage: >
      Three-stop gradient used for animated card borders (conic-gradient
      rotating via ::before pseudo-element with CSS mask), primary action
      buttons (linear-gradient), and hero/emphasis text (background-clip text).

  key-patterns:
    - 'font-light on all headings and body copy'
    - 'Pill-shaped buttons and badges (radius 9999px)'
    - 'Tags and cards use rounded-md / rounded-xl to differentiate from pills'
    - 'Bottom-border-only inputs — no boxed fields, bg-transparent'
    - 'Glassmorphism cards: bg-card/50 backdrop-blur-sm'
    - 'Animated gradient borders: rotating conic-gradient on ::before'
    - 'Muted helper text at 55% lightness, placeholders at /40 opacity'
    - 'Generous whitespace: py-20, mb-12, gap-6'
    - 'Full-screen particle canvas behind all content (z-index 0, pointer-events none)'

# ============================================================================
# APPLICATION STRUCTURE
# ============================================================================

views:
  # --------------------------------------------------------------------------
  # VIEW 1: Dashboard — The landing page and operations overview
  # --------------------------------------------------------------------------
  dashboard:
    route: /
    description: >
      Primary view when the client opens StageManager. Shows a high-level
      snapshot of their development pipeline: active projects, queued ideas
      ranked by priority score, recent bug reports, and quick-access to
      start a new charter.
    sections:
      priority-queue:
        description: >
          Ranked list of application ideas and process improvements. Each
          item shows its name, a brief description, and its composite
          priority score. Items are color-coded by score tier (critical,
          high, medium, low). Clicking an item opens its detail view.
        data-model: ideas[]
        sort: priority-score descending

      active-projects:
        description: >
          Cards showing projects that have an active charter. Each card
          shows project name, current status (in-progress, review, deployed),
          and a progress indicator. Clicking opens the charter detail.
        data-model: charters[]
        filter: status in [active, review]

      recent-activity:
        description: >
          Compact feed showing recent bug reports, feature requests, and
          status changes. Timestamps relative (e.g., "2 hours ago").
          Serves as the pulse of ongoing development activity.
        data-model: activity[]
        limit: 10

      quick-actions:
        description: >
          Prominent buttons for the two most common actions: "New Idea"
          (opens the intake wizard) and "Report Issue" (opens the bug/
          feature request form). Styled with the gradient button treatment.

  # --------------------------------------------------------------------------
  # VIEW 2: Intake Wizard — Capturing new ideas and opportunities
  # --------------------------------------------------------------------------
  intake-wizard:
    route: /new
    description: >
      Multi-step wizard card for capturing a new process improvement idea
      or application opportunity. Uses the animated gradient border card
      component. The card container stays mounted across all steps — only
      inner content transitions. AI-generated suggestion tags appear on
      steps 2+ based on previous answers.
    component-style: >
      Centered card (max-w-3xl), glassmorphism with animated rotating
      conic-gradient border. Navigation via step dots and back button.
      Bottom-border-only textarea input. Suggestion tags as clickable
      pills. Action bar with gradient OK button, Enter hint, optional
      Skip, and voice mic placeholder.
    steps:
      - id: problem
        question: 'What process or pain point are you looking to address?'
        placeholder: 'Describe the problem or opportunity...'
        required: true
        input-type: textarea

      - id: impact
        question: 'Who does this affect and how often?'
        placeholder: 'Teams, frequency, downstream effects...'
        required: true
        input-type: textarea
        suggestions: ai-generated # Based on step 1 answer

      - id: current-state
        question: 'How is this handled today?'
        placeholder: 'Current tools, workarounds, manual steps...'
        required: true
        input-type: textarea
        suggestions: ai-generated

      - id: desired-outcome
        question: 'What does success look like?'
        placeholder: 'Ideal end state, measurable improvements...'
        required: true
        input-type: textarea
        suggestions: ai-generated

      - id: constraints
        question: 'Any constraints or considerations?'
        placeholder: 'Budget, timeline, integration requirements, compliance...'
        required: false
        input-type: textarea
        suggestions:
          - 'Must integrate with existing ERP'
          - 'Needs to work on mobile devices'
          - 'Compliance or audit requirements'
          - 'Limited internal technical resources'

      - id: urgency
        question: 'How urgent is this?'
        required: true
        input-type: select
        suggestions:
          - 'Blocking other work'
          - 'Causing daily friction'
          - 'Would improve efficiency'
          - 'Exploring for the future'
        submit-label: 'Score & Prioritize'

    on-complete: >
      Submit all answers to the scoring engine. Generate a composite
      priority score based on impact, urgency, feasibility, and alignment
      with organizational goals from the scaffolding. Transition to the
      scored result view showing where this idea ranks in the queue.

  # --------------------------------------------------------------------------
  # VIEW 3: Idea Detail — Deep view of a scored opportunity
  # --------------------------------------------------------------------------
  idea-detail:
    route: /ideas/:id
    description: >
      Full detail view for a scored idea. Shows all intake answers, the
      composite priority score with breakdown by dimension (impact, urgency,
      feasibility, alignment), and an action to generate a charter from
      this idea.
    sections:
      score-breakdown:
        description: >
          Visual breakdown of the four scoring dimensions. Each dimension
          shown as a horizontal bar or radial indicator with its individual
          score and the composite total prominent. Uses semantic colors
          (green for high scores, amber for medium, red for low).
        dimensions:
          - impact # How many people/processes affected, severity
          - urgency # Time sensitivity, blocking nature
          - feasibility # Technical complexity, resource requirements
          - alignment # Fit with organizational goals from scaffolding

      intake-summary:
        description: >
          Clean rendering of all wizard answers. Each step's question
          and response displayed in sequence. Editable — client can
          refine answers after initial intake and rescore.

      actions:
        - generate-charter # Primary action — creates charter from this idea
        - edit # Return to wizard with answers pre-filled
        - archive # Remove from active queue
        - link-issues # Associate existing bug reports or feature requests

  # --------------------------------------------------------------------------
  # VIEW 4: Charter View — The generated execution plan
  # --------------------------------------------------------------------------
  charter-view:
    route: /charters/:id
    description: >
      Displays a generated charter and execution plan for a specific
      project. This is the primary output of StageManager — the document
      that gets fed to an agentic coding tool alongside the scaffolding
      package. The charter is generated via Claude API using the idea's
      intake data combined with the client's scaffolding context.
    sections:
      charter-document:
        description: >
          The full charter rendered in a clean, readable format. Includes
          project overview, objectives, technical approach, acceptance
          criteria, estimated timeline, and the execution plan with
          sequenced tasks. Rendered as structured content, not raw YAML.
        format: structured-display
        exportable: true # Download as YAML, Markdown, or copy to clipboard

      scaffolding-context:
        description: >
          Collapsible section showing which scaffolding documents were
          referenced during charter generation. Gives the client
          transparency into how their organizational standards shaped
          the output.

      status-tracking:
        description: >
          Simple status progression for the charter: Draft → Reviewed →
          In Progress → Complete. Client can advance status manually.
          Status changes appear in the dashboard activity feed.
        statuses:
          - draft
          - reviewed
          - in-progress
          - complete

      linked-issues:
        description: >
          Any bug reports or feature requests associated with this
          project. Displayed as a compact list with severity/type badges.

  # --------------------------------------------------------------------------
  # VIEW 5: Issues — Bug and feature request tracking
  # --------------------------------------------------------------------------
  issues:
    route: /issues
    description: >
      Central view for all bug reports and feature requests submitted by
      end users of applications the client has built. Filterable by type
      (bug, feature request), severity, associated project, and status.
      This is the feedback loop that informs development priorities.
    sections:
      issue-list:
        description: >
          Filterable, sortable list of all issues. Each row shows type
          badge (bug or feature), title, associated project, severity,
          status, and submission date. Clicking opens detail.
        filters:
          - type: [bug, feature-request]
          - severity: [critical, high, medium, low]
          - status: [open, in-progress, resolved, closed]
          - project: [linked charter/project names]

      issue-detail:
        description: >
          Full issue view with description, steps to reproduce (for bugs),
          expected vs actual behavior, screenshots or attachments, and
          a comment thread for internal discussion.

      new-issue-form:
        description: >
          Streamlined form for submitting a new issue. Uses the same
          bottom-border input aesthetic as the wizard. Fields: title,
          type selector (bug/feature), severity, associated project
          (dropdown), description, and optional attachment.

  # --------------------------------------------------------------------------
  # VIEW 6: Scaffolding — View and manage the foundation documents
  # --------------------------------------------------------------------------
  scaffolding:
    route: /scaffolding
    description: >
      Read-only view of the scaffolding package that was produced during
      the consulting engagement. Organized by document type. This is the
      reference material that the client's team can review to understand
      what governs their AI development standards. Editing is intentionally
      limited in the prototype — scaffolding updates should be deliberate.
    document-types:
      - company-context # Who the organization is, their domain
      - technology-preferences # Tech stack, hosting, infrastructure choices
      - brand-standards # Voice, terminology, design language
      - security-patterns # Auth, data handling, compliance requirements
      - quality-standards # Testing, documentation, code standards

# ============================================================================
# DATA MODELS
# ============================================================================

data:
  storage: local-storage # Prototype only — no backend for initial build
  note: >
    All data persisted to browser localStorage for the prototype. Structure
    the data layer with clear interfaces so migration to a real backend
    (Supabase, API, etc.) is straightforward. Use Zustand stores with
    persistence middleware.

  models:
    idea:
      fields:
        - id: string # UUID
        - title: string # Generated from intake or user-provided
        - status: enum # new, scored, charter-generated, archived
        - intake-answers: map # Step ID → answer text
        - scores: map # Dimension → numeric score (0-100)
        - composite-score: number
        - created-at: datetime
        - updated-at: datetime
        - linked-charter-id: string | null
        - linked-issue-ids: string[]

    charter:
      fields:
        - id: string
        - idea-id: string # Source idea
        - title: string
        - content: object # Structured charter document
        - status: enum # draft, reviewed, in-progress, complete
        - scaffolding-refs: string[] # Which scaffolding docs were used
        - created-at: datetime
        - updated-at: datetime
        - linked-issue-ids: string[]

    issue:
      fields:
        - id: string
        - type: enum # bug, feature-request
        - title: string
        - description: string
        - severity: enum # critical, high, medium, low
        - status: enum # open, in-progress, resolved, closed
        - project-id: string | null # Linked charter/project
        - created-at: datetime
        - updated-at: datetime
        - comments: comment[]

    comment:
      fields:
        - id: string
        - author: string
        - content: string
        - created-at: datetime

    activity:
      fields:
        - id: string
        - type: enum # idea-created, charter-generated, issue-filed, status-changed
        - entity-id: string
        - entity-type: enum # idea, charter, issue
        - summary: string
        - created-at: datetime

# ============================================================================
# SCORING ENGINE
# ============================================================================

scoring:
  description: >
    When an idea completes the intake wizard, it is scored across four
    dimensions. For the prototype, scoring uses a rules-based approach
    with weighted heuristics derived from the intake answers. Future
    iterations will use Claude API to score with scaffolding context.

  dimensions:
    impact:
      weight: 0.30
      factors:
        - Number of people/teams affected
        - Frequency of the problem
        - Downstream consequences

    urgency:
      weight: 0.25
      factors:
        - Blocking nature (from urgency step)
        - Time sensitivity signals in answers

    feasibility:
      weight: 0.25
      factors:
        - Technical complexity signals
        - Integration requirements
        - Resource constraints mentioned

    alignment:
      weight: 0.20
      factors:
        - Match with organizational goals from scaffolding
        - Fit with existing technology preferences
        - Consistency with stated strategic direction

  output:
    per-dimension: 0-100
    composite: weighted-average
    tiers:
      critical: 80-100
      high: 60-79
      medium: 40-59
      low: 0-39

# ============================================================================
# CHARTER GENERATION
# ============================================================================

charter-generation:
  description: >
    When the client clicks "Generate Charter" on a scored idea, the system
    combines the intake answers with the relevant scaffolding documents
    and sends them to the Claude API. The response is a structured charter
    document with project overview, objectives, technical approach,
    acceptance criteria, timeline estimate, and a sequenced execution plan.

  api:
    provider: anthropic
    model: claude-sonnet-4-20250514
    approach: >
      Construct a system prompt that includes the relevant scaffolding
      context (company context, tech preferences, quality standards).
      The user message includes the full intake data and scoring
      breakdown. Request structured output in a defined schema.

  output-schema:
    project-overview: string
    objectives: string[]
    technical-approach: string
    acceptance-criteria: string[]
    estimated-timeline: string
    execution-plan:
      - phase: string
        tasks: string[]
        duration: string
        dependencies: string[]

  prototype-note: >
    For the prototype, charter generation can use mock/simulated output
    if API access is not configured. Include a toggle or environment
    variable to switch between live API calls and mock data so the
    prototype is demonstrable without requiring API keys.

# ============================================================================
# UI COMPONENTS — REFERENCE
# ============================================================================

components:
  wizard-card:
    description: >
      The primary multi-step intake component. See the StageManager UI
      Reference document for full implementation details including animated
      gradient border CSS, step dot navigation, bottom-border textarea,
      suggestion tags, and action bar patterns.
    file: WIZARD_CARD_REFERENCE.md # The attached UI reference document

  particle-background:
    description: >
      Full-screen canvas or CSS radial gradient fallback behind all content.
      Fixed position, pointer-events none, z-index 0. For the prototype,
      the CSS-only approach is sufficient.
    css-fallback: |
      body {
        background-color: hsl(225, 64%, 11%);
        background-image:
          radial-gradient(ellipse at 20% 50%, hsla(217, 100%, 61%, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 20%, hsla(175, 80%, 55%, 0.06) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 80%, hsla(263, 80%, 65%, 0.04) 0%, transparent 50%);
      }

  score-display:
    description: >
      Reusable component for showing priority scores. Horizontal bar or
      radial gauge per dimension, color-coded by tier. Composite score
      shown prominently. Used in idea detail and dashboard priority queue.

  status-badge:
    description: >
      Small pill badge showing entity status. Uses semantic colors.
      Applied to charters (draft/reviewed/in-progress/complete),
      issues (open/in-progress/resolved/closed), and ideas (new/scored/
      charter-generated/archived).

  gradient-button:
    description: >
      Primary action button with three-stop gradient background
      (blue → teal → purple). Pill-shaped, text-white, font-medium.
      Active state scales down (active:scale-95). Used for primary
      CTAs across all views.

# ============================================================================
# PROTOTYPE SCOPE & CONSTRAINTS
# ============================================================================

scope:
  included:
    - Full intake wizard flow with all six steps
    - Dashboard with priority queue, active projects, and activity feed
    - Idea detail view with score breakdown
    - Charter generation (mock or live API)
    - Charter display with structured rendering
    - Issue tracking list and submission form
    - Scaffolding document viewer (read-only, populated with sample data)
    - Local storage persistence
    - Responsive layout (desktop-first, functional on tablet)

  excluded:
    - User authentication and multi-tenancy
    - Real backend or database
    - File upload / attachment handling
    - Voice input (mic button is placeholder only)
    - Real-time collaboration
    - Export to external formats beyond clipboard copy
    - Scaffolding editing capabilities
    - Integration with external agentic coding tools

  sample-data: >
    Include realistic sample data for demonstration purposes. At least
    three scored ideas at different priority tiers, one generated charter
    in draft status, five issues of mixed types and severities, and a
    complete scaffolding package representing a fictional manufacturing
    company. This allows the prototype to be demonstrated without any
    setup.

# ============================================================================
# FILE STRUCTURE
# ============================================================================

structure:
  src/:
    main.tsx: 'App entry point'
    App.tsx: 'Root component with router'
    index.css: 'Global styles, CSS custom properties, gradient animations'

    components/:
      ui/: 'shadcn/ui components (button, card, badge, progress, tabs, tooltip)'
      wizard/: 'Wizard card, step navigation, suggestion tags, action bar'
      dashboard/: 'Priority queue, active projects, activity feed, quick actions'
      scoring/: 'Score display, dimension bars, tier badges'
      charter/: 'Charter document renderer, status tracker'
      issues/: 'Issue list, issue detail, new issue form'
      scaffolding/: 'Document viewer, document type navigation'
      layout/: 'App shell, sidebar navigation, header'
      shared/: 'Status badges, gradient button, animated border card'

    stores/:
      ideas.ts: 'Zustand store for ideas with localStorage persistence'
      charters.ts: 'Zustand store for charters'
      issues.ts: 'Zustand store for issues'
      activity.ts: 'Zustand store for activity feed'
      scaffolding.ts: 'Zustand store for scaffolding documents'

    lib/:
      scoring.ts: 'Scoring engine logic'
      charter-generator.ts: 'Charter generation (API call or mock)'
      sample-data.ts: 'Demo data loader'
      utils.ts: 'Shared utilities'

    types/:
      index.ts: 'All TypeScript interfaces and enums'

# ============================================================================
# BUILD & RUN
# ============================================================================

setup:
  commands:
    - 'npm create vite@latest stage-manager -- --template react-ts'
    - 'cd stage-manager && npm install'
    - 'npx shadcn@latest init' # New York style, Slate base, CSS variables: yes
    - 'npx shadcn@latest add button card badge progress tabs tooltip'
    - 'npm install lucide-react zustand react-router-dom'
    - 'npm install @fontsource-variable/inter'

  environment:
    VITE_ANTHROPIC_API_KEY: 'optional — enables live charter generation'
    VITE_USE_MOCK_DATA: 'true — set false when API key is available'
