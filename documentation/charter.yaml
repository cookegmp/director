charter:
  project: "Director Application"
  type: "Web Application"
  stage: "MVP"
  charter_version: "2.0.0"
  charter_date: "2026-03-21"
  revision_notes:
    - "v1.0.0: Initial charter with monorepo extraction approach."
    - "v1.1.0: Aligned tech stack with Control README."
    - "v2.0.0: Replaced monorepo approach with clone-and-strip. Director is an independent repo cloned from Control, with client-specific code removed and consultant-specific pages built in its place. No shared package, no workspace orchestration."
  description: >
    Clone the Control (client-facing) application into a new repository and
    strip out all client-specific functionality, retaining the design system,
    layout shell, shared components, and infrastructure patterns. Build the
    Director (consultant-facing) application on that foundation. Director is
    the governance and pre-production tool used exclusively by Project Foundry
    consultants — it never deploys to clients. It guides discovery, manages
    scaffolding assembly, administers OCAI assessments, and produces the
    scaffolding packages that feed everything downstream. The two applications
    share the same visual identity because they share the same origin.

owners:
  product_owner: "James — technical architect, methodology designer, lead consultant"
  tech_owner: "James"

tech_stack:
  note: "Inherited from Control. No changes to the stack."
  runtime: "Node.js 20.x"
  framework: "React 19.x, TypeScript 5.9.x (strict mode)"
  bundler: "Vite 7.x (SPA, no SSR)"
  css: "Tailwind CSS 4.x"
  component_library: "shadcn/ui (Radix UI primitives)"
  state_management: "Zustand 5.x with persist middleware (localStorage)"
  routing: "React Router DOM 7.x"
  drag_and_drop: "dnd-kit"
  icons: "Lucide React 0.575.x"
  animation: "CSS-based (conic-gradient borders, backdrop-blur, transitions)"
  ai_conversation: "OpenRouter for multi-model routing (configured at runtime in Settings)"
  testing: "Vitest 4.x, jsdom, Testing Library"
  fonts: "Inter variable font"
  package_manager: "npm"

architecture:
  approach: >
    Clone Control's repository into a new directory. Remove all client-specific
    pages, modules, stores, and libs. Retain the design system (index.css, all
    CSS tokens and animations), layout components (AppShell, Sidebar), shared
    UI components (components/ui/*, components/shared/*, components/wizard/*,
    components/kanban/*), hooks (useDictation), and infrastructure (lib/utils.ts,
    Vite config, tsconfig, test setup). Build Director's pages and stores on
    top of what remains.

  what_stays:
    design_system:
      - "src/index.css — all HSL custom property tokens, global styles, animation keyframes"
      - "src/components/ui/* — all shadcn/ui Radix primitives (button, card, badge, tabs, dialog, dropdown-menu, input, textarea, select, tooltip, etc.)"
    layout:
      - "src/components/layout/AppShell.tsx — update nav config and branding for Director"
      - "src/components/layout/Sidebar.tsx — update nav items for Director routes"
    shared_components:
      - "src/components/shared/GradientButton.tsx"
      - "src/components/shared/SegmentedToggle.tsx"
      - "src/components/shared/wizard/* (WizardSuggestionTags, index.ts)"
      - "src/components/wizard/WizardCard.tsx"
      - "src/components/kanban/* (KanbanBoard, KanbanColumn, KanbanCard)"
      - "src/components/DictationButton.tsx (if present at component root)"
    hooks:
      - "src/hooks/useDictation.ts"
    lib:
      - "src/lib/utils.ts — ID generation, date formatting, cn() helper"
    infrastructure:
      - "vite.config.ts — update port to 3950, update allowed hosts"
      - "vitest.config.ts"
      - "tsconfig.app.json, tsconfig.node.json"
      - "tailwind config"
      - ".eslintrc, .prettierrc"
      - ".env — update variable names/defaults for Director"
      - "src/test/setup.ts, src/test/smoke.test.ts"

  what_gets_removed:
    pages:
      - "src/pages/DashboardPage.tsx"
      - "src/pages/IntakePage.tsx"
      - "src/pages/IssueReportPage.tsx"
      - "src/pages/IdeasListPage.tsx"
      - "src/pages/IdeaDetailPage.tsx"
      - "src/pages/ChartersListPage.tsx"
      - "src/pages/CharterViewPage.tsx"
      - "src/pages/IssuesPage.tsx"
      - "src/pages/ScaffoldingPage.tsx (replaced by Director's editable scaffolding page)"
      - "src/pages/NewPage.tsx"
    modules:
      - "src/modules/issue-reporter/* (entire module)"
      - "src/modules/issue-scoring/* (entire module)"
      - "src/modules/agents-skills/* (entire module)"
    components:
      - "src/components/dev-portal/* (agent build monitor — client-specific)"
      - "src/components/admin/* (client admin panel — replaced by Director settings)"
      - "src/components/production/* (production dashboard — client-specific)"
      - "src/components/scoring/* (score breakdown — client-specific)"
      - "src/components/timeline/* (idea history — client-specific)"
      - "src/components/idea-views/* (status-specific idea views — client-specific)"
    stores:
      - "src/stores/ideas.ts"
      - "src/stores/charters.ts"
      - "src/stores/issues.ts"
      - "src/stores/activity.ts"
      - "src/stores/agent-sessions.ts"
      - "src/stores/agents-skills.ts"
      - "src/stores/scaffolding.ts (replaced by Director's editable scaffolding store)"
      - "src/stores/settings.ts (replaced by Director's settings store)"
      - "src/stores/users.ts (replaced — Director is single-user consultant tool)"
      - "src/stores/dev-settings.ts"
    libs:
      - "src/lib/scoring.ts"
      - "src/lib/charter-generator.ts"
      - "src/lib/agent-connection.ts"
      - "src/lib/abstraction-layer.ts"
      - "src/lib/permissions.ts"
      - "src/lib/sample-data.ts (replaced by Director's sample data)"
    hooks:
      - "src/hooks/useIdeaTimeline.ts"
      - "src/hooks/useAgentConnection.ts"
    types:
      - "src/types/index.ts (replaced by Director's domain types)"
    other:
      - "mock-server/* (WebSocket mock agent server — client-specific)"
      - "public/level-set-logo.svg (replaced by Director branding)"
      - "documentation/* (Control-specific charter and design docs)"

  director_data_model:
    entities:
      client:
        fields:
          - "id: string (uuid)"
          - "name: string"
          - "industry: string"
          - "size_range: enum (small, mid, large)"
          - "status: enum (prospect, discovery, scaffolding, building, active, archived)"
          - "primary_contact: string"
          - "notes: text"
          - "created_at: datetime"
          - "updated_at: datetime"

      engagement:
        fields:
          - "id: string (uuid)"
          - "client_id: FK → client"
          - "phase: enum (discovery, scaffolding, first_build, handoff, subscription)"
          - "start_date: date"
          - "target_end_date: date | null"
          - "actual_end_date: date | null"
          - "status: enum (active, paused, complete)"
        relationships:
          - "belongs_to: client"
          - "has_many: discovery_sessions, scaffolding_sections, ocai_assessments"

      discovery_session:
        fields:
          - "id: string (uuid)"
          - "engagement_id: FK → engagement"
          - "session_type: enum (stakeholder_interview, system_walkthrough, workflow_observation, brand_collection)"
          - "title: string"
          - "participants: string[]"
          - "transcript: text (AI conversation log)"
          - "extracted_data: jsonb (structured findings)"
          - "scaffolding_sections_affected: string[]"
          - "status: enum (scheduled, in_progress, complete, reviewed)"
          - "session_date: datetime"

      scaffolding_package:
        fields:
          - "id: string (uuid)"
          - "engagement_id: FK → engagement"
          - "version: string (semver)"
          - "tier1_process_workflow: jsonb"
          - "tier1_culture_profile: jsonb"
          - "tier1_data_systems: jsonb"
          - "tier2_company_context: jsonb"
          - "tier2_brand_standards: jsonb"
          - "tier2_tech_preferences: jsonb"
          - "tier2_quality_standards: jsonb"
          - "tier2_security_patterns: jsonb"
          - "validation_status: enum (draft, review, validated, exported)"
          - "exported_at: datetime | null"

      ocai_assessment:
        fields:
          - "id: string (uuid)"
          - "engagement_id: FK → engagement"
          - "level: enum (1_baseline, 2_workflow, 3_idea)"
          - "target_scope: string (org-wide for L1, workflow name for L2, idea ref for L3)"
          - "questions: jsonb (generated question set)"
          - "responses: jsonb (collected responses)"
          - "analysis: jsonb (CVF quadrant scores, gap analysis)"
          - "status: enum (draft, deployed, collecting, complete, analyzed)"

      terminology_entry:
        fields:
          - "id: string (uuid)"
          - "scaffolding_id: FK → scaffolding_package"
          - "client_term: string"
          - "universal_concept: string"
          - "context: string (where/how this term is used)"
          - "source_session: FK → discovery_session | null"

  director_persistence: >
    All data lives in localStorage, same architecture as Control. Each Zustand
    store writes to a dedicated key prefixed 'director-'. DATA_VERSION constant
    in App.tsx triggers full clear and re-seed when incremented. The app is fully
    demonstrable without any server infrastructure or API keys.

  director_environment:
    port: 3950
    env_variables:
      - "VITE_USE_MOCK_DATA: boolean — when true, all AI features use mock fallbacks. Default: true"
    allowed_hosts:
      - "lab.ahaus.com"
      - "director.ahaus.com"

scope:
  included:
    clone_and_strip:
      - "Clone Control repository into a new directory"
      - "Remove all client-specific pages, modules, components, stores, libs, hooks, and types listed in architecture.what_gets_removed"
      - "Remove mock-server/ directory"
      - "Remove Control-specific documentation/"
      - "Update App.tsx: remove Control routing, remove Control DATA_VERSION and seeding logic, add Director routing and seeding"
      - "Update Sidebar.tsx: replace Control nav items with Director nav items (Clients, Engagements, Discovery, Scaffolding, OCAI, Terminology, Settings)"
      - "Update AppShell.tsx: replace Control branding with Director branding"
      - "Update vite.config.ts: port 3950, allowed hosts (lab.ahaus.com, director.ahaus.com)"
      - "Update .env: VITE_USE_MOCK_DATA=true, remove VITE_ANTHROPIC_API_KEY and VITE_AGENT_WS_URL"
      - "Update package.json: rename to 'director', remove mock-server scripts and dependencies (ws)"
      - "Replace public/level-set-logo.svg with Director branding asset"
      - "Verify: npm install, npm run dev starts on port 3950, app renders the shell with empty placeholder pages, npm run build succeeds with zero errors"

    director_types_and_stores:
      - "src/types/index.ts — all Director domain interfaces and enums (Client, Engagement, DiscoverySession, ScaffoldingPackage, OCAIAssessment, TerminologyEntry, and their status/phase enums)"
      - "src/stores/clients.ts — Zustand persist store (localStorage key 'director-clients'). CRUD for client organizations."
      - "src/stores/engagements.ts — Zustand persist store ('director-engagements'). CRUD for engagements linked to clients."
      - "src/stores/discovery.ts — Zustand persist store ('director-discovery'). Session management, transcript storage, extracted data."
      - "src/stores/scaffolding.ts — Zustand persist store ('director-scaffolding'). Per-section editing, validation status tracking, version history."
      - "src/stores/ocai.ts — Zustand persist store ('director-ocai'). Assessment lifecycle, response collection, analysis results."
      - "src/stores/terminology.ts — Zustand persist store ('director-terminology'). Decoder entries linked to scaffolding packages."
      - "src/stores/settings.ts — Zustand persist store ('director-settings'). AI provider config, OpenRouter key (runtime entry)."
      - "src/lib/sample-data.ts — comprehensive mock data for two fictional clients at different engagement phases"

    director_clients_page:
      - "Client list view: filterable by status, sortable by name/date/status"
      - "Client detail panel: engagement history, current phase indicator, quick-access to scaffolding and discovery sessions"
      - "New client creation form: name, industry, size range, primary contact, notes"
      - "Client status progression visualization (prospect → discovery → scaffolding → building → active)"

    director_engagements_page:
      - "Engagement list for the selected client, showing phase, dates, and status"
      - "Engagement creation: link to client, set phase, start date, target end date"
      - "Phase progression controls: advance engagement through discovery → scaffolding → first_build → handoff → subscription"
      - "Engagement detail view with tabs or sections linking to discovery sessions, scaffolding, and OCAI assessments for that engagement"

    director_discovery_page:
      - "Session list for the active engagement, grouped by session type"
      - "Session creation: select type (stakeholder interview, system walkthrough, workflow observation, brand collection), add participants, set date"
      - "AI-guided interview interface using the WizardCard pattern — conversation flows that follow scripted sequences per session type"
      - "Session transcript view with extracted data highlights"
      - "Scaffolding section linkage: each session shows which scaffolding sections it contributes to"

    director_scaffolding_page:
      - "Two-tier visual layout matching the scaffolding specification (Tier 1: Operational Intelligence, Tier 2: Build Intelligence)"
      - "Section-by-section editor for each scaffolding component (process & workflow, culture profile, data & systems, company context, brand standards, tech preferences, quality standards, security patterns)"
      - "Completion indicators per section (empty, draft, reviewed, validated)"
      - "Terminology decoder management: add, edit, search, import from discovery sessions"
      - "Scaffolding export: generate portable package (JSON or YAML) for handoff"
      - "Validation check: flag incomplete or inconsistent sections before export"

    director_ocai_page:
      - "Assessment management dashboard: view all assessments across levels for the active engagement"
      - "Level 1 baseline builder: generate 10-12 behavioral scenario questions, configure target respondent groups (leadership vs. staff), deploy assessment"
      - "Level 2 workflow-specific builder: auto-generate questions from scaffolding's process & workflow intelligence, 2-3 questions per critical workflow"
      - "Response collection interface: display questions, capture responses, track completion rates"
      - "CVF quadrant visualization: radar chart showing Clan, Adhocracy, Hierarchy, Market scores"
      - "Gap analysis view: stated values (leadership L1) vs. actual behavior (staff L1) vs. workflow-specific patterns (L2)"

    director_terminology_page:
      - "Full terminology decoder view: searchable, sortable table of all entries for the active scaffolding"
      - "Add/edit/delete entries: client term, universal concept, context, source session link"
      - "Bulk import from discovery session extracted data"
      - "Export as standalone JSON or CSV"

    director_settings_page:
      - "AI provider configuration: OpenRouter API key entry (stored in localStorage at runtime), model selection per function"
      - "Mock data toggle: visual indicator of VITE_USE_MOCK_DATA state"
      - "About section: Director version, build date"

  excluded:
    - "BackStage server application — Director is frontend-only in this charter; BackStage API is a separate charter"
    - "Live API integration — all data is mock/localStorage in this build"
    - "Level 3 OCAI (idea-level) — requires charter generation pipeline, which lives in Control"
    - "Cross-client pattern library — requires multiple client datasets; deferred to post-launch"
    - "Adaptive AI question generation for discovery interviews — the interview AI follows scripted flows per session type; adaptive generation is a module charter"
    - "Scaffolding-to-charter pipeline — that generation logic lives in Control"
    - "Authentication and authorization — Director runs on consultant hardware; auth is deferred until multi-consultant support is needed"
    - "Mobile/responsive optimization — Director is a desktop tool used on consultant laptops"
    - "Production deployment pipeline — Director runs locally via npm run dev; deployment is a separate concern"
    - "Data migration from existing scaffolding documents — manual entry or import tooling is a module charter"
    - "Print/PDF export of scaffolding — deferred to module charter"
    - "Real-time collaboration — single-consultant tool"
    - "Synchronizing shared components back to Control — the apps are independent; if a component improvement is made in one, it is manually ported to the other as needed"

  sample_data:
    - "Two fictional client organizations: 'Precision Dynamics' (mid-size manufacturer, 180 employees, in scaffolding phase) and 'Midwest Distribution Co' (distributor, 95 employees, in discovery phase)"
    - "Precision Dynamics has a complete scaffolding package with all eight sections populated, three completed discovery sessions, a Level 1 OCAI with analyzed results, and a Level 2 in progress"
    - "Midwest Distribution has two discovery sessions (one complete, one in-progress), a partial scaffolding (Tier 1 started, Tier 2 empty), and a Level 1 OCAI deployed but not yet complete"
    - "Terminology decoder for Precision Dynamics with 30+ entries covering their ERP terms, shop floor language, and organizational roles"
    - "Six sample discovery session transcripts across different session types"

design_system:
  inheritance: >
    Inherited directly from Control via the clone. Same index.css, same
    shadcn/ui components, same layout patterns. The UX matches because
    the code is the same code.

  color_tokens:
    background: "hsl(225, 64%, 11%) — deep navy page background"
    card: "hsl(225, 50%, 15%) — slightly lighter navy card backgrounds"
    primary: "hsl(217, 100%, 61%) — vivid blue (Control default — see accent_differentiation)"
    active: "hsl(175, 63%, 47%) — teal for running/in-progress states"
    completed: "hsl(142, 71%, 45%) — green for success/done states"
    error: "hsl(0, 72%, 51%) — red for failed/destructive states"

  patterns:
    glassmorphism: "Cards use bg-card/50 backdrop-blur-sm"
    featured_cards: "Animated rotating conic-gradient border via CSS ::before pseudo-element"
    gradient_buttons: "Three-stop gradient (Blue → Teal → Purple)"
    inputs: "Bottom-border only with transparent backgrounds (no boxed fields)"
    typography: "Inter variable font at font-light weight throughout"
    border_radius: "Radix UI radius set to 9999px (pill) for buttons and badges"

  director_specific:
    accent_differentiation: >
      Director overrides --primary to an amber/gold tone (approximately hsl(38, 92%, 50%))
      to give consultants an immediate visual signal of which application they are in.
      This affects the sidebar active indicator, page headers, and gradient button first
      stop. All other tokens remain identical. The override is a single CSS custom property
      change in Director's index.css.
    sidebar_branding: >
      Sidebar footer shows Director branding instead of the Level Set AI logo.
      Nav items: Clients, Engagements, Discovery, Scaffolding, OCAI, Terminology, Settings.

non_negotiables:
  - "The clone-and-strip must be clean — no dead imports, no orphaned files, no references to removed modules. After stripping, the app builds with zero TypeScript errors and zero lint warnings."
  - "Director uses Zustand 5.x with persist middleware writing to localStorage with 'director-' key prefix. DATA_VERSION seeding pattern from Control must be replicated."
  - "VITE_USE_MOCK_DATA=true is the default. All AI-powered features must have mock fallbacks with simulated delays. The app must be fully demonstrable without any API keys."
  - "TypeScript 5.9.x strict mode. No implicit any. No ts-ignore without documented justification."
  - "The design system (index.css tokens, shadcn/ui components, layout patterns) is not modified during the strip — only the accent color override and branding are changed."
  - "Every phase closes with: lint passes, typecheck passes, app builds successfully, app renders with sample data on port 3950."

definition_of_done:
  - "Director repository exists as an independent project, cloned from Control with all client-specific code removed."
  - "'npm install && npm run dev' starts Director on port 3950 with no errors."
  - "'npm run build' produces dist/ with zero TypeScript errors and zero lint warnings."
  - "Director's dark glassmorphism aesthetic matches Control exactly, with amber/gold accent color as the only visual differentiation."
  - "Director Clients page displays the two sample client organizations with filtering by status, sorting, and status progression visualization."
  - "Director Engagements page shows engagement list per client with phase progression controls."
  - "Director Discovery page shows session list grouped by type, allows session creation, and renders the interview wizard with scripted conversation flows."
  - "Director Scaffolding page renders the two-tier layout (Operational Intelligence / Build Intelligence) with section editors, completion indicators (empty/draft/reviewed/validated), and terminology decoder management."
  - "Director OCAI page shows assessment dashboard, Level 1 and Level 2 builders, response collection interface, and CVF radar chart visualization."
  - "Director Terminology page shows searchable decoder table with add/edit/delete and bulk import from discovery sessions."
  - "Director Settings page has OpenRouter API key configuration stored in localStorage and mock data toggle indicator."
  - "Sample data for both fictional clients (Precision Dynamics, Midwest Distribution Co) auto-seeds on first load and renders correctly across all pages."
  - "DATA_VERSION in App.tsx triggers full re-seed when incremented."
  - "No references to removed Control modules remain in the codebase. No dead imports. No orphaned store keys."
